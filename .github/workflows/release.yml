name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  # ------------------------------------------------------------------
  # Release ref guard
  # ------------------------------------------------------------------
  # Everything below builds `github.sha`, but the release is *named* by a tag.
  # For a `v*` tag push those are the same commit by construction; for a manual
  # dispatch they are not, because the run is started from a branch while the
  # tag names something else. Assert the two agree so "the checks passed for
  # the released commit" is a fact rather than an assumption.
  release-ref:
    name: Release tag resolves to this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag points at the commit being built
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # actions/checkout does not always leave the tag ref in place (it
          # fetches the ref it was asked for, which for a dispatch is a branch).
          # Fetch it explicitly so a missing local ref cannot be mistaken for a
          # missing tag. `^{commit}` dereferences annotated tags.
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          if ! TAG_SHA="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")"; then
            echo "::error::Tag ${TAG} does not exist. Push the tag before dispatching a release."
            exit 1
          fi
          if [ "$TAG_SHA" != "$SHA" ]; then
            echo "::error::Tag ${TAG} points at ${TAG_SHA}, but this run builds ${SHA}."
            echo "Re-run the release from the tagged commit so the gating checks,"
            echo "the built artifacts, and the tag all describe the same revision."
            exit 1
          fi
          echo "Release ${TAG} == ${SHA}."

  # ------------------------------------------------------------------
  # Required checks
  # ------------------------------------------------------------------
  # These call the very same workflows that gate ordinary pushes and pull
  # requests, rather than a second copy that can drift from them. Calling them
  # (instead of querying past runs) means they execute against this run's
  # checkout: no path filter can skip them, and an older green run on an
  # earlier commit cannot stand in for this one.
  ci-enforcement:
    name: CI Enforcement
    needs: release-ref
    uses: ./.github/workflows/ci-enforcement.yml

  launch-planner:
    name: Launch Planner CI
    needs: release-ref
    uses: ./.github/workflows/launch-planner.yml

  e2e:
    name: E2E Tests
    needs: release-ref
    uses: ./.github/workflows/e2e.yml

  # ------------------------------------------------------------------
  # Build Desktop
  # ------------------------------------------------------------------
  build-desktop:
    needs: [release-ref, ci-enforcement, launch-planner, e2e]
    environment: windows-signing
    permissions:
      contents: write
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      # tauri-action merges latest.json with the existing release asset. Keep
      # the desktop uploads serialized so the platform entries are not lost
      # when the macOS ARM and Intel jobs update that asset together.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: ""
            # Tauri only logs custom sign-command stdout/stderr at debug level.
            # Keep the real signing error visible instead of just "failed to run pwsh".
            args: "--verbose"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Linux: Tauri needs webkit2gtk and other system deps
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # The tag is the single source of truth for the version. Without this the
      # bundle version comes from the checked-in tauri.conf.json, which is how
      # v0.5.0 shipped installers named Agora.Launcher_0.1.0_*. Runs before the
      # frontend install so package.json is already correct when Vite inlines it.
      - name: Set version from tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PY="$(command -v python3 || command -v python)"
          "$PY" scripts/set_release_version.py "$TAG"
          "$PY" scripts/set_release_version.py --check

      # The updater is only as good as its signing key. A placeholder pubkey or
      # a missing private key produces installers the updater can never verify,
      # and that is not visible until a user tries to update — so fail here
      # instead of shipping a release that can never be updated from.
      - name: Verify updater signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          PUBKEY="$(python -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['plugins']['updater']['pubkey'])")"
          if [ -z "$PUBKEY" ] || [ "$PUBKEY" = "REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY" ]; then
            echo "::error::tauri.conf.json still holds the updater pubkey placeholder."
            echo "Generate a keypair with 'npx tauri signer generate', set the private half"
            echo "as the TAURI_SIGNING_PRIVATE_KEY secret, and commit the public half."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set for this repository."
            echo "Without it tauri-action cannot sign updater artifacts, so clients would"
            echo "reject every update."
            exit 1
          fi

      - name: Install frontend dependencies
        run: |
          cd desktop
          npm install

      - name: Set up Windows signing
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-signing

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public OAuth app ID (not a secret); read from the Actions variable
          # when present and fall back to a secret for legacy setups.
          AGORA_OAUTH_CLIENT_ID: ${{ vars.AGORA_OAUTH_CLIENT_ID || secrets.AGORA_OAUTH_CLIENT_ID }}
          AGORA_REGISTRY_REPO: ${{ github.repository }}
          VITE_AGORA_REPOSITORY: ${{ github.repository }}
          # Public key (not a secret); read from the Actions variable when
          # present and fall back to a secret for legacy setups.
          AGORA_REGISTRY_PUBKEY: ${{ vars.AGORA_REGISTRY_PUBKEY || secrets.AGORA_REGISTRY_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # A key generated with a passphrase cannot be decoded without it, and
          # tauri-action only reports that ~14 minutes into the build. Leave the
          # secret unset when the key has no passphrase; an empty value is what
          # an unencrypted key expects anyway.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Agora ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Desktop installers and standalone CLI archives for Windows, macOS, and Linux
            are attached below. The Windows `-setup.exe` is the recommended installer, or
            use the portable ZIP; macOS has `.dmg` builds for Apple Silicon and Intel;
            Linux has `.AppImage`, `.deb`, and `.rpm`. The `agora-cli-*` archives are the
            command-line builds. Verify downloads against `SHA256SUMS`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ runner.os == 'Windows' && format('--config "{0}"', env.AGORA_WINDOWS_SIGNING_CONFIG) || '' }}

      # Tauri restores the unsigned main binary after creating signed installers.
      # Sign the standalone executable separately before the portable ZIP is made.
      - name: Sign and verify Windows portable desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ./scripts/sign-windows.ps1 -FilePath "target/release/agora-desktop.exe"'

      - name: Package and upload Windows portable desktop
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ./scripts/test_package_portable.ps1
          ./scripts/package_portable.ps1 -Executable target/release/agora-desktop.exe -Version $env:RELEASE_TAG -OutputDirectory "$env:RUNNER_TEMP/agora-portable"
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Portable packaging failed' }
          $assets = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/agora-portable" -File
          gh release upload $env:RELEASE_TAG @($assets.FullName) --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Portable upload failed' }

      - name: Verify packaged macOS build
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          BUNDLE_DIR="target/${TARGET}/release/bundle"
          APP="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          UPDATER="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"

          test -n "$APP" || { echo "::error::No packaged .app found under $BUNDLE_DIR"; exit 1; }
          test -n "$DMG" || { echo "::error::No packaged .dmg found under $BUNDLE_DIR"; exit 1; }
          test -n "$UPDATER" || { echo "::error::No packaged updater archive found under $BUNDLE_DIR"; exit 1; }
          test -f "${UPDATER}.sig" || { echo "::error::No updater signature found for $UPDATER"; exit 1; }

          case "$TARGET" in
            aarch64-apple-darwin) EXPECTED_MACHO='arm64' ;;
            x86_64-apple-darwin) EXPECTED_MACHO='x86_64' ;;
            *) echo "::error::Unexpected macOS target: $TARGET"; exit 1 ;;
          esac

          APP_BINARY="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          file "$APP_BINARY" | grep -Eq "$EXPECTED_MACHO" || {
            echo "::error::Packaged binary does not contain the expected $EXPECTED_MACHO architecture."
            file "$APP_BINARY"
            exit 1
          }

          # Exercise the actual packaged binary briefly; this is intentionally
          # separate from tauri dev so bundle/runtime failures are visible.
          "$APP_BINARY" >"$RUNNER_TEMP/agora-packaged-launch.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 10); do
            kill -0 "$APP_PID" 2>/dev/null && sleep 1 || {
              cat "$RUNNER_TEMP/agora-packaged-launch.log"
              echo "::error::Packaged Agora app exited during launch smoke test."
              exit 1
            }
          done
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true

  # ------------------------------------------------------------------
  # Build CLI
  # ------------------------------------------------------------------
  build-cli:
    needs: [release-ref, ci-enforcement, launch-planner, e2e]
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            archive: zip
            platform_name: windows-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: ""
            archive: tar.gz
            platform_name: linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            archive: tar.gz
            platform_name: macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            archive: tar.gz
            platform_name: macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates -> target

      - name: Install Linux cross-compile deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The tag is the single source of truth for the version. Without this the
      # bundle version comes from the checked-in tauri.conf.json, which is how
      # v0.5.0 shipped installers named Agora.Launcher_0.1.0_*. Runs before the
      # frontend install so package.json is already correct when Vite inlines it.
      - name: Set version from tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PY="$(command -v python3 || command -v python)"
          "$PY" scripts/set_release_version.py "$TAG"
          "$PY" scripts/set_release_version.py --check

      - name: Build CLI
        run: cargo build --release --locked -p agora-cli --target ${{ matrix.target }}

      - name: Set up Windows signing
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-signing

      - name: Sign and verify Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ./scripts/sign-windows.ps1 -FilePath "target/${{ matrix.target }}/release/agora.exe"'

      - name: Package CLI (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BIN="target/${{ matrix.target }}/release/agora${{ matrix.ext }}"
          ARCHIVE="agora-cli-${TAG}-${{ matrix.platform_name }}.zip"
          7z a "$ARCHIVE" "$BIN"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Package CLI (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BIN="target/${{ matrix.target }}/release/agora${{ matrix.ext }}"
          ARCHIVE="agora-cli-${TAG}-${{ matrix.platform_name }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Assemble Release
  # ------------------------------------------------------------------
  assemble-release:
    needs: [build-desktop, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download CLI artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cli-*
          path: cli-artifacts
          merge-multiple: true

      - name: Upload CLI files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          for f in cli-artifacts/*; do
            echo "Uploading $f ..."
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done

      # Renames Tauri's Agora.Launcher_* bundles into the shared
      # agora-<kind>-<tag>-<platform>-<arch> scheme, deletes the *.sig sidecars,
      # rewrites latest.json to the new names, and writes a SHA256SUMS that
      # covers every downloadable artifact. Idempotent, so a re-run is safe.
      - name: Normalize assets and publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          python3 scripts/finalize_release_assets.py --repo "$GITHUB_REPOSITORY" --tag "$TAG"

      # GitHub sorts the asset list alphabetically and collapses long lists
      # behind "Show all N assets", so the asset list alone buries the standard
      # Windows installer. The draft body leads with direct links instead. This
      # runs after finalize so the links name assets that exist, and it leaves
      # latest.json's updater notes (tauri-action's short body) untouched.
      - name: Add direct download links to the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG"
          NOTES="$RUNNER_TEMP/agora-release-notes.md"
          # Quoted heredoc plus sed: the markdown below uses backticks, which
          # an unquoted heredoc would run as command substitution.
          sed -e "s|@TAG@|$TAG|g" -e "s|@BASE@|$BASE|g" > "$NOTES" <<'EOF'
          ## Download Agora

          The asset list below is alphabetical; these direct links are the fastest path.

          | Platform | Recommended download |
          | --- | --- |
          | **Windows** | [agora-desktop-@TAG@-windows-x64-setup.exe](@BASE@/agora-desktop-@TAG@-windows-x64-setup.exe) |
          | Windows (portable, no installer) | [agora-desktop-@TAG@-windows-x64-portable.zip](@BASE@/agora-desktop-@TAG@-windows-x64-portable.zip) |
          | macOS (Apple Silicon) | [agora-desktop-@TAG@-macos-arm64.dmg](@BASE@/agora-desktop-@TAG@-macos-arm64.dmg) |
          | macOS (Intel) | [agora-desktop-@TAG@-macos-x64.dmg](@BASE@/agora-desktop-@TAG@-macos-x64.dmg) |
          | Linux | [agora-desktop-@TAG@-linux-x64.AppImage](@BASE@/agora-desktop-@TAG@-linux-x64.AppImage) |

          `.msi`, `.deb`, and `.rpm` installers plus the macOS updater archives are in the asset list.

          ### Command line

          Standalone `agora` builds; no installer required.

          | Platform | Archive |
          | --- | --- |
          | Windows | [agora-cli-@TAG@-windows-x64.zip](@BASE@/agora-cli-@TAG@-windows-x64.zip) |
          | macOS (Apple Silicon) | [agora-cli-@TAG@-macos-arm64.tar.gz](@BASE@/agora-cli-@TAG@-macos-arm64.tar.gz) |
          | macOS (Intel) | [agora-cli-@TAG@-macos-x64.tar.gz](@BASE@/agora-cli-@TAG@-macos-x64.tar.gz) |
          | Linux | [agora-cli-@TAG@-linux-x64.tar.gz](@BASE@/agora-cli-@TAG@-linux-x64.tar.gz) |

          Verify downloads against `SHA256SUMS`.
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"

      - name: Verify release assets and updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CHECK_DIR="$RUNNER_TEMP/agora-release-check"
          mkdir -p "$CHECK_DIR"
          # The release is deliberately a draft; the REST tag endpoint only
          # resolves published releases. The CLI also finds accessible drafts.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            >"$CHECK_DIR/release.json"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$CHECK_DIR" \
            --clobber
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS \
            --dir "$CHECK_DIR" \
            --clobber

          python - "$CHECK_DIR" "$TAG" <<'PY'
          import json
          import pathlib
          import sys

          sys.path.insert(0, "scripts")
          import finalize_release_assets as fra

          root = pathlib.Path(sys.argv[1])
          tag = sys.argv[2]
          release = json.loads((root / "release.json").read_text())
          latest = json.loads((root / "latest.json").read_text())
          asset_names = [asset["name"] for asset in release["assets"]]

          # The release must carry exactly the expected artifacts: a missing one
          # means a build job dropped something, and an unexpected one is usually
          # a naming drift that would leave a duplicate installer in the list.
          expected = set(fra.expected_asset_names(tag))
          missing = sorted(expected - set(asset_names))
          if missing:
              raise SystemExit(f"release is missing expected assets: {missing}")
          unexpected = fra.unexpected_asset_names(asset_names, tag)
          if unexpected:
              raise SystemExit(f"release carries unexpected assets: {unexpected}")

          # SHA256SUMS must cover every downloadable artifact and nothing else.
          covered = set()
          for line in (root / "SHA256SUMS").read_text().splitlines():
              digest, separator, name = line.partition("  ")
              if separator != "  " or not fra.digest_hex(f"sha256:{digest}") or not name:
                  raise SystemExit(f"malformed SHA256SUMS line: {line!r}")
              covered.add(name)
          if covered != expected:
              raise SystemExit(
                  "SHA256SUMS does not cover the release: "
                  f"missing={sorted(expected - covered)}, extra={sorted(covered - expected)}"
              )

          # Every updater URL must resolve to a published asset, the darwin
          # entries must stay signed archives, and the Windows entries the
          # updater selects by install kind (MSI vs NSIS) must all be present.
          platforms = latest.get("platforms", {})
          for key in ("windows-x86_64", "windows-x86_64-msi", "windows-x86_64-nsis"):
              entry = platforms.get(key)
              if not entry or not entry.get("signature"):
                  raise SystemExit(f"latest.json is missing a signed {key} entry")
          for key, entry in platforms.items():
              url = entry.get("url", "")
              basename = url.rsplit("/", 1)[-1]
              if basename not in asset_names:
                  raise SystemExit(f"latest.json {key} URL does not name a release asset: {url!r}")
              if key.startswith("darwin-"):
                  if not entry.get("signature"):
                      raise SystemExit(f"latest.json {key} entry is not signed")
                  if not basename.endswith(".app.tar.gz"):
                      raise SystemExit(f"latest.json {key} URL is not an .app.tar.gz: {url!r}")

          print(f"Verified {len(expected)} artifacts, their checksums, and the updater metadata.")
          PY

      # The release stays a draft here on purpose: a human must smoke-test
      # the artifacts and publish explicitly (see docs/RELEASING.md).
