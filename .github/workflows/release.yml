name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  # ------------------------------------------------------------------
  # Release ref guard
  # ------------------------------------------------------------------
  # Everything below builds `github.sha`, but the release is *named* by a tag.
  # For a `v*` tag push those are the same commit by construction; for a manual
  # dispatch they are not, because the run is started from a branch while the
  # tag names something else. Assert the two agree so "the checks passed for
  # the released commit" is a fact rather than an assumption.
  release-ref:
    name: Release tag resolves to this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag points at the commit being built
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # actions/checkout does not always leave the tag ref in place (it
          # fetches the ref it was asked for, which for a dispatch is a branch).
          # Fetch it explicitly so a missing local ref cannot be mistaken for a
          # missing tag. `^{commit}` dereferences annotated tags.
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          if ! TAG_SHA="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")"; then
            echo "::error::Tag ${TAG} does not exist. Push the tag before dispatching a release."
            exit 1
          fi
          if [ "$TAG_SHA" != "$SHA" ]; then
            echo "::error::Tag ${TAG} points at ${TAG_SHA}, but this run builds ${SHA}."
            echo "Re-run the release from the tagged commit so the gating checks,"
            echo "the built artifacts, and the tag all describe the same revision."
            exit 1
          fi
          echo "Release ${TAG} == ${SHA}."

  # ------------------------------------------------------------------
  # Required checks
  # ------------------------------------------------------------------
  # These call the very same workflows that gate ordinary pushes and pull
  # requests, rather than a second copy that can drift from them. Calling them
  # (instead of querying past runs) means they execute against this run's
  # checkout: no path filter can skip them, and an older green run on an
  # earlier commit cannot stand in for this one.
  ci-enforcement:
    name: CI Enforcement
    needs: release-ref
    uses: ./.github/workflows/ci-enforcement.yml

  launch-planner:
    name: Launch Planner CI
    needs: release-ref
    uses: ./.github/workflows/launch-planner.yml

  e2e:
    name: E2E Tests
    needs: release-ref
    uses: ./.github/workflows/e2e.yml

  # ------------------------------------------------------------------
  # Build Desktop
  # ------------------------------------------------------------------
  build-desktop:
    needs: [release-ref, ci-enforcement, launch-planner, e2e]
    strategy:
      fail-fast: false
      # tauri-action merges latest.json with the existing release asset. Keep
      # the desktop uploads serialized so the platform entries are not lost
      # when the macOS ARM and Intel jobs update that asset together.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: ""
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Linux: Tauri needs webkit2gtk and other system deps
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # The tag is the single source of truth for the version. Without this the
      # bundle version comes from the checked-in tauri.conf.json, which is how
      # v0.5.0 shipped installers named Agora.Launcher_0.1.0_*. Runs before the
      # frontend install so package.json is already correct when Vite inlines it.
      - name: Set version from tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PY="$(command -v python3 || command -v python)"
          "$PY" scripts/set_release_version.py "$TAG"
          "$PY" scripts/set_release_version.py --check

      # The updater is only as good as its signing key. A placeholder pubkey or
      # a missing private key produces installers the updater can never verify,
      # and that is not visible until a user tries to update — so fail here
      # instead of shipping a release that can never be updated from.
      - name: Verify updater signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          PUBKEY="$(python -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['plugins']['updater']['pubkey'])")"
          if [ -z "$PUBKEY" ] || [ "$PUBKEY" = "REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY" ]; then
            echo "::error::tauri.conf.json still holds the updater pubkey placeholder."
            echo "Generate a keypair with 'npx tauri signer generate', set the private half"
            echo "as the TAURI_SIGNING_PRIVATE_KEY secret, and commit the public half."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set for this repository."
            echo "Without it tauri-action cannot sign updater artifacts, so clients would"
            echo "reject every update."
            exit 1
          fi

      - name: Install frontend dependencies
        run: |
          cd desktop
          npm install

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public OAuth app ID (not a secret); read from the Actions variable
          # when present and fall back to a secret for legacy setups.
          AGORA_OAUTH_CLIENT_ID: ${{ vars.AGORA_OAUTH_CLIENT_ID || secrets.AGORA_OAUTH_CLIENT_ID }}
          AGORA_REGISTRY_REPO: ${{ github.repository }}
          VITE_AGORA_REPOSITORY: ${{ github.repository }}
          # Public key (not a secret); read from the Actions variable when
          # present and fall back to a secret for legacy setups.
          AGORA_REGISTRY_PUBKEY: ${{ vars.AGORA_REGISTRY_PUBKEY || secrets.AGORA_REGISTRY_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # A key generated with a passphrase cannot be decoded without it, and
          # tauri-action only reports that ~14 minutes into the build. Leave the
          # secret unset when the key has no passphrase; an empty value is what
          # an unencrypted key expects anyway.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Agora ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            ## Desktop
            Download the installer for your platform below.
            - Windows: `.msi` or `.exe`
            - macOS: `.dmg`
            - Linux: `.AppImage` or `.deb`

            ## CLI
            Standalone command-line binaries (no installer required). See `SHA256SUMS` for checksums.
            - `agora-v*-windows-x86_64.zip`
            - `agora-v*-linux-x86_64.tar.gz`
            - `agora-v*-macos-x86_64.tar.gz`
            - `agora-v*-macos-aarch64.tar.gz`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify packaged macOS build
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          BUNDLE_DIR="target/${TARGET}/release/bundle"
          APP="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          UPDATER="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"

          test -n "$APP" || { echo "::error::No packaged .app found under $BUNDLE_DIR"; exit 1; }
          test -n "$DMG" || { echo "::error::No packaged .dmg found under $BUNDLE_DIR"; exit 1; }
          test -n "$UPDATER" || { echo "::error::No packaged updater archive found under $BUNDLE_DIR"; exit 1; }
          test -f "${UPDATER}.sig" || { echo "::error::No updater signature found for $UPDATER"; exit 1; }

          case "$TARGET" in
            aarch64-apple-darwin) EXPECTED_MACHO='arm64' ;;
            x86_64-apple-darwin) EXPECTED_MACHO='x86_64' ;;
            *) echo "::error::Unexpected macOS target: $TARGET"; exit 1 ;;
          esac

          APP_BINARY="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          file "$APP_BINARY" | grep -Eq "$EXPECTED_MACHO" || {
            echo "::error::Packaged binary does not contain the expected $EXPECTED_MACHO architecture."
            file "$APP_BINARY"
            exit 1
          }

          # Exercise the actual packaged binary briefly; this is intentionally
          # separate from tauri dev so bundle/runtime failures are visible.
          "$APP_BINARY" >"$RUNNER_TEMP/agora-packaged-launch.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 10); do
            kill -0 "$APP_PID" 2>/dev/null && sleep 1 || {
              cat "$RUNNER_TEMP/agora-packaged-launch.log"
              echo "::error::Packaged Agora app exited during launch smoke test."
              exit 1
            }
          done
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true

  # ------------------------------------------------------------------
  # Build CLI
  # ------------------------------------------------------------------
  build-cli:
    needs: [release-ref, ci-enforcement, launch-planner, e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            archive: zip
            platform_name: windows-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: ""
            archive: tar.gz
            platform_name: linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            archive: tar.gz
            platform_name: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            archive: tar.gz
            platform_name: macos-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates -> target

      - name: Install Linux cross-compile deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The tag is the single source of truth for the version. Without this the
      # bundle version comes from the checked-in tauri.conf.json, which is how
      # v0.5.0 shipped installers named Agora.Launcher_0.1.0_*. Runs before the
      # frontend install so package.json is already correct when Vite inlines it.
      - name: Set version from tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PY="$(command -v python3 || command -v python)"
          "$PY" scripts/set_release_version.py "$TAG"
          "$PY" scripts/set_release_version.py --check

      - name: Build CLI
        run: cargo build --release --locked -p agora-cli --target ${{ matrix.target }}

      - name: Package CLI (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BIN="target/${{ matrix.target }}/release/agora${{ matrix.ext }}"
          ARCHIVE="agora-${TAG}-${{ matrix.platform_name }}.zip"
          7z a "$ARCHIVE" "$BIN"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Package CLI (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BIN="target/${{ matrix.target }}/release/agora${{ matrix.ext }}"
          ARCHIVE="agora-${TAG}-${{ matrix.platform_name }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Assemble Release
  # ------------------------------------------------------------------
  assemble-release:
    needs: [build-desktop, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download CLI artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cli-*
          path: cli-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: cli-artifacts
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload CLI files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          for f in cli-artifacts/*; do
            echo "Uploading $f ..."
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done

      - name: Verify macOS release assets and updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p "$RUNNER_TEMP/agora-updater-check"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$RUNNER_TEMP/agora-updater-check" \
            --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            >"$RUNNER_TEMP/agora-updater-check/release.json"

          python - "$RUNNER_TEMP/agora-updater-check" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          release = json.loads((root / "release.json").read_text())
          latest = json.loads((root / "latest.json").read_text())
          asset_names = [asset["name"] for asset in release["assets"]]

          markers = {
              "aarch64": ("aarch64", "arm64"),
              "x86_64": ("x86_64", "x64"),
          }
          for architecture, names in markers.items():
              bundles = [
                  name
                  for name in asset_names
                  if name.endswith(".dmg")
                  and any(marker in name for marker in names)
              ]
              updater_archives = [
                  name
                  for name in asset_names
                  if name.endswith(".app.tar.gz")
                  and any(marker in name for marker in names)
              ]
              if not bundles or not updater_archives:
                  raise SystemExit(
                      f"missing {architecture} macOS assets; "
                      f"dmg={bundles!r}, updater={updater_archives!r}"
                  )

              platform = latest.get("platforms", {}).get(f"darwin-{architecture}")
              if not platform or not platform.get("signature"):
                  raise SystemExit(
                      f"latest.json is missing a signed darwin-{architecture} entry"
                  )
              if not platform.get("url", "").endswith(".app.tar.gz"):
                  raise SystemExit(
                      f"darwin-{architecture} updater URL is not an .app.tar.gz: "
                      f"{platform.get('url')!r}"
                  )

          print("Verified Intel and Apple Silicon macOS bundles and updater entries.")
          PY

      # The release stays a draft here on purpose: a human must smoke-test
      # the artifacts and publish explicitly (see docs/RELEASING.md).
