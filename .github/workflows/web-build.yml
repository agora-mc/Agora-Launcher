# Web Build
#
# Builds the static Next.js web site and uploads the exported output as an
# artifact. Depends on a registry-* release existing (created by compile.yml).
#
# Runs only on the nightly schedule (after the Nightly Compiler completes)
# or via manual workflow_dispatch. It intentionally does NOT run on
# commits/pushes so it can never block pull requests.

name: "Web Build"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate registry-web.json from flat files
        run: |
          pip install -r compiler/requirements.txt
          python compiler/compile.py --skip-sign --governance-mode off

      - name: Generate docs-web.json from markdown documentation
        run: python scripts/build_docs_web.py


      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload static site
        uses: actions/upload-artifact@v6
        with:
          name: web-static
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: web-static
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
