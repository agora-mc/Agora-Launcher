<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora — music audition</title>
<style>
  :root{
    --bg:#12141a; --panel:#191d26; --line:#262c39; --ink:#e8ecf4; --dim:#8e98ad;
    --accent:#6fd3a8; --accent2:#7aa7ff; --warn:#f0b657;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif;padding:24px}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .wrap{max-width:1040px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;cursor:pointer;transition:border-color .15s,transform .1s;position:relative}
  .card:hover{border-color:#3d465a;transform:translateY(-1px)}
  .card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .card h3{margin:0;font-size:14.5px;font-weight:600}
  .card .who{color:var(--dim);font-size:12.5px;margin:1px 0 8px}
  .meta{color:var(--dim);font-size:11.5px;display:flex;gap:8px;flex-wrap:wrap}
  .mood{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
    background:#232938;color:var(--accent2)}
  .mood.calm{color:#7fd4c4} .mood.moody{color:#9b9bf0} .mood.playful{color:#f2c66b}
  .mood.exciting{color:#f28b6b} .mood.dramatic{color:#f0707a}
  .bar{height:3px;background:#232938;border-radius:2px;margin-top:9px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .12s linear}
  .bay{position:sticky;top:0;z-index:5;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:14px;
    align-items:center;flex-wrap:wrap}
  button{font:inherit;background:#232938;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 13px;cursor:pointer}
  button:hover{border-color:#4a5468}
  button.p{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:600}
  label{font-size:12.5px;color:var(--dim);display:flex;gap:6px;align-items:center}
  input[type=range]{width:110px}
  .now{font-size:13px;min-width:230px}
  .now b{color:var(--accent)}
  .vx{display:flex;gap:6px;flex-wrap:wrap}
  .vx button{padding:3px 9px;font-size:12px}
  .vx button.off{opacity:.4;text-decoration:line-through}
  .vx button.sel{background:var(--accent2);color:#0d1117;border-color:var(--accent2);font-weight:600}
  .lbl{font-size:12.5px;color:var(--dim)}
  select{font:inherit;background:#232938;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:5px 8px}
  .note{color:var(--warn);font-size:11.5px;margin-top:6px;display:none}
  .card.on .note{display:block}
  footer{color:var(--dim);font-size:12px;margin-top:22px;line-height:1.7}
  code{background:#232938;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Music audition</h1>
  <div class="sub">Every track generated by <code>mxl2track.py</code> from real MusicXML.
    Click a card to play. Nothing autoplays.</div>

  <div class="bay">
    <button id="stop">Stop</button>
    <label>Volume <input type="range" id="vol" min="0" max="100" value="55"></label>
    <label><input type="checkbox" id="loop" checked> Loop</label>
    <div class="now" id="now">—</div>
    <div class="vx" id="vx"></div>
  </div>

  <div class="bay">
    <span class="lbl">Instrument</span>
    <div class="vx" id="instr"></div>
    <label>Octave
      <select id="oct">
        <option value="-24">−2</option><option value="-12">−1</option>
        <option value="0" selected>0</option><option value="12">+1</option>
      </select>
    </label>
    <label title="Rolls high notes off in gain and softens the 2-5 kHz band, where the ear is most sensitive. Turn it off to hear what Sugar Plum sounded like before.">
      <input type="checkbox" id="tame" checked> Tame high notes</label>
  </div>

  <div class="grid" id="grid"></div>

  <footer id="foot"></footer>
</div>

<script src="music-tracks.js"></script>
<script>
(function () {
  "use strict";
  var NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var LOOKAHEAD = 0.15, TICK = 25;

  var AC = null, master = null, shelf = null, timer = null, st = null, muted = {};
  var vol = 0.55, loop = true, transpose = 0, tame = true;
  var instrument = null, userPicked = false;      // null = follow the track's own default

  function freq(name) {
    var m = /^([A-G]#?)(-?\d+)$/.exec(name);
    var midi = (+m[2] + 1) * 12 + NAMES.indexOf(m[1]) + transpose;
    return 440 * Math.pow(2, (midi - 69) / 12);   // A4 = 440, so middle C = C4 = 261.6
  }

  /* Register compensation. Equal gain across the range is not equal loudness:
     the ear peaks around 2-5 kHz, so a note at C7 reads as piercing at a level
     that is comfortable at C4. Sugar Plum is 27% above C6 and tops out at B7,
     which is why it was the one that hurt. Real instruments roll off up there;
     this does the same, with a floor so highs stay present. */
  function rolloff(f) {
    if (!tame || f <= 600) return 1;
    return Math.max(0.3, Math.pow(600 / f, 0.7));
  }

  var EPS = 0.0002;
  function env(p, at, dur, peak, atk, rel) {            // sustained envelope
    atk = Math.min(atk, dur * 0.3); rel = Math.min(rel, dur * 0.6);
    peak = Math.max(peak, EPS);
    p.setValueAtTime(EPS, at);
    p.exponentialRampToValueAtTime(peak, at + atk);
    p.setValueAtTime(peak, Math.max(at + atk, at + dur - rel));
    p.exponentialRampToValueAtTime(EPS, at + dur);
  }
  function decay(p, at, peak, tail) {                   // struck/plucked envelope
    peak = Math.max(peak, EPS);
    p.setValueAtTime(EPS, at);
    p.exponentialRampToValueAtTime(peak, at + 0.006);
    p.exponentialRampToValueAtTime(EPS, at + tail);
  }
  function ring(dur, mult, cap) {                       // how long a struck note rings
    return Math.min(cap, Math.max(0.28, dur * mult));
  }

  /* Karplus-Strong: a burst of noise in a delay line the length of one period,
     fed back through an averaging lowpass. Physical modelling rather than
     oscillators - the reason it is here is that it is a genuinely different
     technique, and its natural behaviour (high strings decay fast) is exactly
     what the top of Sugar Plum needs. Buffers are cached; they are cheap but
     Bumblebee asks for ~13 notes a second. */
  var ksCache = {}, ksKeys = [];
  function ksBuf(f, tail) {
    var key = f.toFixed(1) + "|" + tail.toFixed(2);
    if (ksCache[key]) return ksCache[key];
    var sr = AC.sampleRate, n = Math.max(2, Math.round(sr / f));
    var len = Math.max(2, Math.ceil(sr * tail));
    var b = AC.createBuffer(1, len, sr), d = b.getChannelData(0);
    var r = new Float32Array(n), i;
    for (i = 0; i < n; i++) r[i] = Math.random() * 2 - 1;
    var dec = Math.pow(0.0006, 1 / (tail * sr)), idx = 0;
    for (i = 0; i < len; i++) {
      d[i] = r[idx];
      var nx = r[(idx + 1) % n];
      r[idx] = 0.5 * (r[idx] + nx) * dec;
      idx = (idx + 1) % n;
    }
    if (ksKeys.length > 500) delete ksCache[ksKeys.shift()];
    ksKeys.push(key); ksCache[key] = b;
    return b;
  }

  var organWave = null;
  function organW() {
    if (!organWave) {                                    // drawbar-ish partials
      var im = new Float32Array([0, 1, .5, .35, .25, 0, .16, 0, .11]);
      organWave = AC.createPeriodicWave(new Float32Array(im.length), im);
    }
    return organWave;
  }

  function osc(type, f, at, until) {
    var o = AC.createOscillator();
    if (type === "organ") o.setPeriodicWave(organW()); else o.type = type;
    o.frequency.setValueAtTime(f, at);
    o.start(at); o.stop(until);
    return o;
  }

  var INSTR = {
    chip: { name: "Chiptune", play: function (f, at, dur, g) {   // subtractive, square
      var lp = AC.createBiquadFilter(), gn = AC.createGain();
      lp.type = "lowpass"; lp.Q.value = .4;
      lp.frequency.setValueAtTime(Math.min(9000, f * 4 + 700), at);
      osc("square", f, at, at + dur + .1).connect(lp);
      env(gn.gain, at, dur, g * .6, .006, .1);
      lp.connect(gn); gn.connect(master);
    }},
    musicbox: { name: "Music box", play: function (f, at, dur, g) {  // additive + fast decay
      var t = ring(dur, 1.6, 2.4);
      [[1, 1, 1], [2, .3, .7], [3.9, .1, .45]].forEach(function (p) {
        var gn = AC.createGain();
        osc("sine", f * p[0], at, at + t * p[2] + .05).connect(gn);
        decay(gn.gain, at, g * p[1] * .9, t * p[2]);
        gn.connect(master);
      });
    }},
    rhodes: { name: "Electric piano", play: function (f, at, dur, g) {  // FM, 2:1
      var t = ring(dur, 1.5, 2.6), gn = AC.createGain(), mg = AC.createGain();
      var car = osc("sine", f, at, at + t + .05);
      osc("sine", f * 2, at, at + t + .05).connect(mg);
      mg.gain.setValueAtTime(f * 2.2, at);
      mg.gain.exponentialRampToValueAtTime(f * .02, at + Math.min(.5, t));
      mg.connect(car.frequency);
      decay(gn.gain, at, g, t);
      car.connect(gn); gn.connect(master);
    }},
    pluck: { name: "Plucked string", play: function (f, at, dur, g) {  // Karplus-Strong
      var t = ring(dur, 1.4, 2.2), s = AC.createBufferSource(), gn = AC.createGain();
      s.buffer = ksBuf(f, t);
      gn.gain.setValueAtTime(Math.max(g * 1.6, EPS), at);
      gn.gain.setValueAtTime(Math.max(g * 1.6, EPS), at + t * .9);
      gn.gain.exponentialRampToValueAtTime(EPS, at + t);
      s.connect(gn); gn.connect(master);
      s.start(at); s.stop(at + t + .02);
    }},
    strings: { name: "Strings", play: function (f, at, dur, g) {   // detuned saws, slow attack
      var lp = AC.createBiquadFilter(), gn = AC.createGain(), until = at + dur + .3;
      lp.type = "lowpass"; lp.Q.value = .7;
      lp.frequency.setValueAtTime(Math.min(6500, f * 3.2 + 400), at);
      osc("sawtooth", f * 0.9965, at, until).connect(lp);
      osc("sawtooth", f * 1.0035, at, until).connect(lp);
      env(gn.gain, at, dur, g * .5, .13, .2);
      lp.connect(gn); gn.connect(master);
    }},
    organ: { name: "Organ", play: function (f, at, dur, g) {       // additive / wavetable
      var gn = AC.createGain();
      osc("organ", f, at, at + dur + .12).connect(gn);
      env(gn.gain, at, dur, g * .45, .02, .09);
      gn.connect(master);
    }},
    bell: { name: "Bells", play: function (f, at, dur, g) {        // inharmonic FM
      var t = ring(dur, 1.8, 3), gn = AC.createGain(), mg = AC.createGain();
      var car = osc("sine", f, at, at + t + .05);
      osc("sine", f * 1.41, at, at + t + .05).connect(mg);
      mg.gain.setValueAtTime(f * 1.5, at);
      mg.gain.exponentialRampToValueAtTime(f * .02, at + t * .5);
      mg.connect(car.frequency);
      decay(gn.gain, at, g * .85, t);
      car.connect(gn); gn.connect(master);
    }}
  };

  function blip(f, at, dur, voice) {
    var peak = voice.gain * vol * rolloff(f);
    if (muted[voice.name] || peak <= 0) return;
    (INSTR[instrument] || INSTR.chip).play(f, at, dur, peak);
  }

  function pump() {
    if (!st) return;
    var now = AC.currentTime, alive = false;
    st.voices.forEach(function (vs) {
      if (vs.done) return;
      alive = true;
      while (vs.time < now + LOOKAHEAD) {
        var ev = vs.v.seq[vs.i], dur = ev[1] * st.beat;
        if (ev[0] !== "R") {
          var ns = Array.isArray(ev[0]) ? ev[0] : [ev[0]];
          for (var k = 0; k < ns.length; k++) blip(freq(ns[k]), vs.time, dur, vs.v);
        }
        vs.time += dur;
        if (++vs.i >= vs.v.seq.length) {
          vs.i = 0;
          if (!loop) { vs.done = true; break; }
          st.loops++;
        }
      }
    });
    if (!alive) return stop();
    var elapsed = now - st.t0, total = st.track.beats * st.beat;
    var pos = loop ? (elapsed % total) : Math.min(elapsed, total);
    st.el.querySelector("i").style.width = (pos / total * 100).toFixed(1) + "%";
    document.getElementById("now").innerHTML =
      "<b>" + st.track.name + "</b> — " + mmss(pos) + " / " + mmss(total) +
      (st.loops ? "  (loop " + (st.loops + 1) + ")" : "");
  }

  function mmss(s) {
    s = Math.max(0, s);
    return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
    if (st) st.el.classList.remove("on");
    st = null;
    document.getElementById("now").textContent = "—";
    document.getElementById("vx").innerHTML = "";
    Array.prototype.forEach.call(document.querySelectorAll(".bar i"),
      function (b) { b.style.width = 0; });
  }

  function play(track, el) {
    stop();
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 1;
      // Shelf, not a lowpass: it pulls down the 2.5 kHz+ band the ear is most
      // sensitive to without dulling everything below it.
      shelf = AC.createBiquadFilter();
      shelf.type = "highshelf"; shelf.frequency.value = 2600; shelf.gain.value = -7;
      master.connect(shelf); shelf.connect(AC.destination);
    }
    if (AC.state === "suspended") AC.resume();
    shelf.gain.value = tame ? -7 : 0;
    if (!userPicked) setInstrument(track.instrument || "chip", false);
    muted = {};
    var t0 = AC.currentTime + 0.08;
    st = {
      track: track, el: el, loops: 0, t0: t0, beat: 60 / track.bpm,
      voices: track.voices.map(function (v) { return { v: v, i: 0, time: t0, done: false }; })
    };
    el.classList.add("on");
    document.getElementById("vx").innerHTML = "";
    track.voices.forEach(function (v) {
      var b = document.createElement("button");
      b.textContent = v.name;
      b.onclick = function () {
        muted[v.name] = !muted[v.name];
        b.classList.toggle("off", !!muted[v.name]);
      };
      document.getElementById("vx").appendChild(b);
    });
    pump();
    timer = setInterval(pump, TICK);
  }

  // ---- build the cards -----------------------------------------------------
  var grid = document.getElementById("grid");
  var order = { playful: 0, exciting: 1, dramatic: 2, moody: 3, calm: 4 };
  var tracks = window.MUSIC_TRACKS.slice().sort(function (a, b) {
    return (order[a.mood] - order[b.mood]) || a.name.localeCompare(b.name);
  });

  tracks.forEach(function (t) {
    var secs = t.beats / t.bpm * 60;
    var el = document.createElement("div");
    el.className = "card";
    el.innerHTML =
      '<h3></h3><div class="who"></div>' +
      '<div class="meta"><span class="mood ' + t.mood + '">' + t.mood + '</span>' +
      '<span>' + mmss(secs) + '</span><span>' + t.bars + ' bars</span>' +
      '<span>&#9833;=' + t.bpm + '</span>' +
      '<span>' + ((INSTR[t.instrument] || {}).name || t.instrument || "—") + '</span></div>' +
      '<div class="bar"><i></i></div><div class="note"></div>';
    el.querySelector("h3").textContent = t.name;
    el.querySelector(".who").textContent = t.composer + ", " + t.year + " · " + t.marking;
    el.querySelector(".note").textContent =
      t.source + (t.tempoNote ? " · tempo: " + t.tempoNote : "");
    el.onclick = function () { if (st && st.track === t) stop(); else play(t, el); };
    grid.appendChild(el);
  });

  // ---- instrument bank ----------------------------------------------------
  function setInstrument(id, byUser) {
    instrument = id;
    if (byUser) userPicked = true;
    Array.prototype.forEach.call(document.querySelectorAll("#instr button"),
      function (b) { b.classList.toggle("sel", b.dataset.id === id); });
  }
  Object.keys(INSTR).forEach(function (id) {
    var b = document.createElement("button");
    b.textContent = INSTR[id].name; b.dataset.id = id;
    b.onclick = function () { setInstrument(id, true); };
    document.getElementById("instr").appendChild(b);
  });
  setInstrument("chip", false);

  document.getElementById("stop").onclick = stop;
  document.getElementById("vol").oninput = function () { vol = this.value / 100; };
  document.getElementById("oct").onchange = function () { transpose = +this.value; };
  document.getElementById("tame").onchange = function () {
    tame = this.checked;
    if (shelf) shelf.gain.value = tame ? -7 : 0;
  };
  document.getElementById("loop").onchange = function () {
    loop = this.checked;
    if (st) st.voices.forEach(function (v) { v.done = false; });
  };

  var mins = tracks.reduce(function (s, t) { return s + t.beats / t.bpm * 60; }, 0);
  var ev = tracks.reduce(function (s, t) {
    return s + t.voices.reduce(function (n, v) { return n + v.seq.length; }, 0); }, 0);
  document.getElementById("foot").innerHTML =
    tracks.length + " tracks · " + Math.round(mins / 60) + " minutes · " +
    ev.toLocaleString() + " note events.<br>" +
    "Compositions are all public domain. Sources differ in what they declare — " +
    "Moonlight is OpenScore (CC0), Mountain King declares Public Domain, the rest are " +
    "MuseScore community uploads with no rights statement. See the header of " +
    "<code>music-tracks.js</code>.";

  window.__music = {
    play: play, stop: stop, tracks: tracks, instruments: INSTR,
    setInstrument: setInstrument, rolloff: rolloff, freq: freq,
    setTranspose: function (n) { transpose = n; },
    state: function () { return st; }
  };
})();
</script>
</body>
</html>
