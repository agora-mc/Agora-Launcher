<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora — Browse v5 (the bazaar)</title>
<style>
  :root{
    --ink:#EAF2F6; --dim:#9FB3C0; --edge:rgba(255,255,255,.12);
    --glass:rgba(14,26,34,.72); --panel:rgba(10,20,27,.9);
    --go:#8BE24F; --hint:#FFD34E; --cool:#6FD3E8; --warm:#FFB25E; --rare:#B48CF2; --no:#FF7A6B;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    background:#0A1820;overflow-x:hidden}
  #bg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:0;display:block}
  #vig{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(130% 95% at 50% 10%,transparent 30%,rgba(4,12,18,.62) 100%)}
  #fx{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
  .wrap{position:relative;z-index:2;max-width:1140px;margin:0 auto;padding:16px 20px 80px}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:22px;margin:0}
  .sub{color:var(--dim);font-size:13.5px}
  .pack{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--glass);
    border:1px solid var(--edge);border-radius:14px;padding:7px 13px;cursor:pointer}
  .pack b{font-size:14px}
  .pack:hover{border-color:rgba(255,255,255,.3)}

  /* ---- stalls ---- */
  .stalls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
  .stall{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--edge);
    border-radius:14px;padding:7px 13px;cursor:pointer;transition:transform .12s,border-color .15s}
  .stall:hover{transform:translateY(-2px)}
  .stall.on{border-color:var(--go);box-shadow:0 0 0 1px var(--go) inset}
  .stall canvas{width:26px;height:26px;display:block}
  .stall span{font-size:13.5px;font-weight:600}

  /* ---- the gacha machine ---- */
  .gachaRow{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch;margin:14px 0 4px}
  .gacha{flex:0 0 220px;background:var(--glass);border:1px solid var(--edge);border-radius:18px;
    padding:12px;text-align:center;cursor:pointer;transition:transform .12s}
  .gacha:hover{transform:translateY(-2px)}
  .gacha canvas{display:block;width:100%;height:110px}
  .gacha b{display:block;margin-top:6px;font-size:14px}
  .gacha small{color:var(--dim);font-size:11.8px}
  .vibe{flex:1 1 320px;background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:13px 15px}
  .vibe h4{margin:0 0 8px;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .bar span{width:78px;color:var(--dim)}
  .bar i{flex:1;height:9px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;display:block}
  .bar i u{display:block;height:100%;width:0;background:var(--cool);transition:width .5s}
  .vibe p{margin:9px 0 0;font-size:12.5px;color:var(--dim)}

  /* ---- shelf ---- */
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:13px;margin-top:16px}
  .thing{position:relative;background:var(--glass);border:1px solid var(--edge);border-radius:16px;
    padding:11px;cursor:pointer;transition:transform .12s,border-color .15s;overflow:hidden}
  .thing:hover{transform:translateY(-3px) rotate(-.5deg);border-color:rgba(255,255,255,.32)}
  .thing canvas{display:block;width:100%;height:88px;border-radius:11px;background:rgba(0,0,0,.2)}
  .thing b{display:block;margin-top:8px;font-size:13.8px}
  .thing small{display:block;color:var(--dim);font-size:11.5px}
  .thing .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:10.5px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.09);color:var(--dim)}
  .thing.rare{border-color:rgba(180,140,242,.6)}
  .thing.rare::after{content:"";position:absolute;inset:-40%;pointer-events:none;
    background:conic-gradient(from 0deg,transparent,rgba(180,140,242,.35),transparent 40%);
    animation:spin 5s linear infinite}
  @keyframes spin{to{transform:rotate(1turn)}}
  .thing .ribbon{position:absolute;top:9px;left:-30px;transform:rotate(-38deg);width:110px;
    text-align:center;font-size:10px;font-weight:800;letter-spacing:.6px;padding:2px 0;
    background:var(--hint);color:#1a1405}
  .thing .inpack{position:absolute;top:8px;right:8px;font-size:15px}
  .vote{display:flex;gap:6px;margin-top:8px}
  .vote button{flex:1;font:inherit;font-size:13px;background:rgba(255,255,255,.07);color:var(--ink);
    border:1px solid var(--edge);border-radius:9px;padding:4px;cursor:pointer}
  .vote button:hover{border-color:rgba(255,255,255,.35)}
  .vote button.on{background:rgba(139,226,79,.2);border-color:var(--go)}
  .vote button.no.on{background:rgba(255,122,107,.2);border-color:var(--no)}

  /* ---- detail ---- */
  .detail{position:fixed;inset:0;z-index:50;background:rgba(4,10,14,.74);backdrop-filter:blur(3px);
    display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .detail.show{opacity:1;pointer-events:auto}
  .dcard{position:relative;width:min(620px,94vw);background:var(--panel);border:1px solid var(--edge);
    border-radius:22px;padding:20px 22px;max-height:88vh;overflow:auto}
  .dcard canvas{width:100%;height:150px;border-radius:14px;background:rgba(0,0,0,.24);display:block}
  .dcard h2{margin:12px 0 2px;font-size:21px}
  .dcard .by{color:var(--dim);font-size:13px}
  .dcard p{font-size:14px}
  .fitline{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px 12px;border-radius:12px;
    font-size:13.5px;background:rgba(139,226,79,.12);border:1px solid rgba(139,226,79,.35)}
  .fitline.bad{background:rgba(255,122,107,.12);border-color:rgba(255,122,107,.38)}
  .close{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.08);color:var(--ink);
    border:1px solid var(--edge);border-radius:10px;padding:5px 11px;cursor:pointer;font:inherit}
  .btn{font:inherit;background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--edge);
    border-radius:11px;padding:9px 16px;cursor:pointer}
  .btn.p{background:var(--go);color:#08131a;border-color:var(--go);font-weight:700}
  .acts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:34px 10px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:70;
    background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:10px 16px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:14px}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="vig"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <h1>The Bazaar</h1>
    <div class="sub">Wander. Poke things. Take what you like.</div>
    <div class="pack" id="packBtn" title="What you've collected">
      <span style="font-size:17px">🎒</span><b id="packCount">0</b><span class="sub">picked</span>
    </div>
  </header>

  <div class="stalls" id="stalls"></div>

  <div class="gachaRow">
    <div class="gacha" id="gacha" tabindex="0" role="button" aria-label="Surprise me">
      <canvas id="gachaArt"></canvas>
      <b>Surprise me</b>
      <small id="gachaHint">Give it a crank</small>
    </div>
    <div class="vibe">
      <h4>What you seem to like</h4>
      <div class="bars" id="bars"></div>
      <p id="vibeNote">Tap 👍 or 👎 on anything. The shelf quietly rearranges itself.</p>
    </div>
  </div>

  <div class="shelf" id="shelf"></div>
</div>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dcard">
    <button class="close" id="dClose">Close</button>
    <canvas id="dArt"></canvas>
    <h2 id="dTitle"></h2>
    <div class="by" id="dBy"></div>
    <p id="dDesc"></p>
    <div class="fitline" id="dFit"></div>
    <div class="acts">
      <button class="btn p" id="dAdd">Put it in my bag</button>
      <button class="btn" id="dSimilar">Show me more like this</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div aria-live="polite" id="live" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>

<script>
(function(){
"use strict";
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var live=document.getElementById("live");
function say(t){ live.textContent=t; }

/* ---------- sound ---------- */
var ac=null;
function blip(f,d,type,v){ if(reduce)return;
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type||"triangle"; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(v||.06,ac.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.12));
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.12)+.03);
  }catch(e){} }
function fanfare(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){blip(f,.18);},i*80); }); }

/* ---------- particles ---------- */
var fx=document.getElementById("fx"), fc=fx.getContext("2d"), parts=[];
function sizeFx(){ fx.width=innerWidth||1280; fx.height=innerHeight||720; }
sizeFx(); addEventListener("resize",sizeFx); addEventListener("load",sizeFx);
function burst(x,y,c,n,sp){ if(reduce)return;
  for(var i=0;i<(n||18);i++) parts.push({x:x,y:y,vx:(Math.random()-.5)*(sp||8),
    vy:(Math.random()-.95)*(sp||8),s:3+Math.random()*4,life:1,c:c,rot:Math.random()*6});
  if(parts.length>260) parts.splice(0,parts.length-260); }
(function loop(){
  fc.clearRect(0,0,fx.width,fx.height);
  for(var i=parts.length-1;i>=0;i--){ var p=parts[i];
    p.vy+=.3;p.x+=p.vx;p.y+=p.vy;p.life-=.016;p.rot+=.2;
    if(p.life<=0){parts.splice(i,1);continue;}
    fc.globalAlpha=Math.max(p.life,0); fc.fillStyle=p.c;
    fc.save();fc.translate(p.x,p.y);fc.rotate(p.rot);fc.fillRect(-p.s/2,-p.s/2,p.s,p.s);fc.restore(); }
  fc.globalAlpha=1; requestAnimationFrame(loop);
})();
function centerOf(el){ var r=el.getBoundingClientRect(); return [r.left+r.width/2,r.top+r.height/2]; }
document.addEventListener("click",function(e){ if(reduce)return; burst(e.clientX,e.clientY,"#9FF5E2",5,4); },true);

/* ---------- drifting market background ---------- */
var bg=document.getElementById("bg"), bx=bg.getContext("2d");
var W=0,H=0,mx=.5,my=.5,t0=performance.now(),lanterns=[];
function sizeBg(){ W=bg.width=innerWidth||1280; H=bg.height=innerHeight||720;
  lanterns=[]; for(var i=0;i<16;i++) lanterns.push({x:Math.random(),y:Math.random()*.7,
    p:Math.random()*6.3, s:.5+Math.random(), h:[42,190,268,20][i%4]}); }
addEventListener("mousemove",function(e){ mx=e.clientX/innerWidth; my=e.clientY/innerHeight; });
function bgFrame(now){
  var t=(now-t0)/1000;
  var g=bx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0D1B2A"); g.addColorStop(.6,"#152B3A"); g.addColorStop(1,"#1D3D46");
  bx.fillStyle=g; bx.fillRect(0,0,W,H);
  // blocky stall rooftops receding into the dark — parallax by depth
  var rows=[[.80,"#132C38",16],[.88,"#17394A",28],[.97,"#1C4657",44]];
  rows.forEach(function(R,ri){
    var off=(mx-.5)*R[2], yo=(my-.5)*R[2]*0.2, y=H*R[0]+yo;
    bx.fillStyle=R[1];
    for(var x=-80;x<W+80;x+=92){
      var bxp=x+off, roof=22+((ri*7+Math.round(x/92))%3)*8;
      bx.fillRect(bxp,y,84,H-y);
      for(var s=0;s<7;s++) bx.fillRect(bxp+s*12, y-roof+s%2*4, 12, roof);
    }
  });
  // floating lanterns — the only ambient motion, slow enough to ignore
  lanterns.forEach(function(l){
    var lx=l.x*W+Math.sin(t*0.25+l.p)*16, ly=l.y*H+Math.cos(t*0.19+l.p)*11;
    var glow=reduce?.5:(0.55+0.45*Math.sin(t*0.9+l.p));
    bx.fillStyle="hsla("+l.h+",80%,64%,"+(0.16*glow)+")";
    bx.fillRect(lx-9,ly-9,18,18);
    bx.fillStyle="hsla("+l.h+",85%,70%,"+(0.75*glow)+")";
    bx.fillRect(lx-3,ly-3,6,6);
  });
  requestAnimationFrame(bgFrame);
}
sizeBg(); addEventListener("resize",sizeBg); addEventListener("load",sizeBg);
requestAnimationFrame(bgFrame);

/* ---------- blocky art ---------- */
function px(c,x,y,w,h,col){ c.fillStyle=col; c.fillRect(x,y,w,h); }
function paint(canvas,fn){ var c=canvas.getContext("2d"), r=canvas.getBoundingClientRect();
  canvas.width=Math.max(40,Math.round(r.width)); canvas.height=Math.max(30,Math.round(r.height));
  c.clearRect(0,0,canvas.width,canvas.height); fn(c,canvas.width,canvas.height); }

// Deterministic monogram art: same name always yields the same creature, so the
// shelf feels like a place with fixed inhabitants rather than random noise.
function hashOf(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function critter(name, hue){
  return function(c,w,h){
    var s=hashOf(name), b=Math.min(w,h)/11, cx=w/2, cy=h/2+b*.6;
    var hu=hue!==undefined?hue:(s%360);
    var body="hsl("+hu+" 58% 52%)", dark="hsl("+hu+" 60% 34%)", light="hsl("+hu+" 70% 72%)";
    // body
    px(c,cx-b*3,cy-b*1.6,b*6,b*3.4,body);
    // head
    px(c,cx-b*4.6,cy-b*3.2,b*3.2,b*3,body);
    px(c,cx-b*4.2,cy-b*2.4,b*.7,b*.7,"#0A1820");                 // eye
    // ears / horns vary by hash
    if(s%3===0){ px(c,cx-b*4.2,cy-b*4.4,b*.8,b*1.3,dark); px(c,cx-b*2.6,cy-b*4.4,b*.8,b*1.3,dark); }
    else if(s%3===1){ px(c,cx-b*4.4,cy-b*4.1,b*2.4,b*.9,dark); }
    // legs
    px(c,cx-b*2.4,cy+b*1.8,b*1,b*1.7,dark); px(c,cx+b*1.4,cy+b*1.8,b*1,b*1.7,dark);
    // tail
    if(s%2===0) px(c,cx+b*3,cy-b*1.2,b*1.6,b*.9,light);
    else px(c,cx+b*2.9,cy-b*2.4,b*.9,b*2.2,light);
    // little sparkle so the tile has life
    px(c,cx+b*1.2,cy-b*3.4,b*.6,b*.6,light);
  };
}
var ICON={
  all:function(c,w,h){ var b=Math.min(w,h)/5;
    px(c,b,b,b*1.4,b*1.4,"#6FD3E8"); px(c,b*2.6,b,b*1.4,b*1.4,"#8BE24F");
    px(c,b,b*2.6,b*1.4,b*1.4,"#FFB25E"); px(c,b*2.6,b*2.6,b*1.4,b*1.4,"#B48CF2"); },
  mod:function(c,w,h){ var b=Math.min(w,h)/5;
    px(c,b*.8,b*1.2,b*1.8,b*1.8,"#6FD3E8"); px(c,b*2.4,b*1.2,b*1.8,b*1.8,"#B48CF2");
    px(c,b*2.4,b*1.9,b*.6,b*.6,"#0A1820"); },
  pack:function(c,w,h){ var b=Math.min(w,h)/5;
    px(c,b*.9,b*1.5,b*3.2,b*2.2,"#B08A4A"); px(c,b*1.8,b*.9,b*1.4,b*.7,"#8A6A34"); },
  shader:function(c,w,h){ var b=Math.min(w,h)/5;
    px(c,b*.8,b*2.6,b*3.4,b*1.2,"#3A7CB0");
    px(c,b*1.6,b*.9,b*1.8,b*1.8,"#FFD34E"); },
  world:function(c,w,h){ var b=Math.min(w,h)/5;
    px(c,b*.9,b*2.2,b*3.2,b*1.6,"#4C8F4F"); px(c,b*1.4,b*1.4,b*.9,b*.9,"#8BE24F");
    px(c,b*2.6,b*1.1,b*.9,b*1.2,"#6B4A2E"); }
};
function gachaArt(c,w,h){
  var b=Math.min(w,h)/9, cx=w/2, base=h-b*.6;
  px(c,cx-b*2.6,base-b*7,b*5.2,b*4,"#2A4C5E");                 // glass dome
  ["#FF7A6B","#FFD34E","#8BE24F","#6FD3E8","#B48CF2"].forEach(function(col,i){
    px(c,cx-b*2+(i%3)*b*1.5, base-b*6.2+Math.floor(i/3)*b*1.4, b*1.2,b*1.2,col); });
  px(c,cx-b*3,base-b*3,b*6,b*3,"#B0453A");                     // body
  px(c,cx-b*1,base-b*2.2,b*2,b*1.6,"#1A2630");                 // chute
  px(c,cx+b*2.2,base-b*2.2,b*1.2,b*1.2,"#FFD34E");             // crank
}

/* ---------- catalogue ---------- */
var CATS=[
  {id:"all",name:"Everything",art:ICON.all},
  {id:"mod",name:"Add-ons",art:ICON.mod},
  {id:"pack",name:"Ready-made worlds",art:ICON.pack},
  {id:"shader",name:"Make it pretty",art:ICON.shader},
  {id:"world",name:"Maps to explore",art:ICON.world}
];
// Vibes are how the shelf sorts itself. Deliberately childlike labels — no
// "categories", no tag taxonomy to learn.
var VIBES=["cosy","wild","silly","pretty","tricky"];
var ITEMS=[
  {n:"Cave Weaver",c:"mod",v:["wild","tricky"],by:"mossline",fit:1,hot:1,
   d:"Digs enormous twisty caves under everything. Bring a torch. Bring lots of torches."},
  {n:"Puddle Physics",c:"mod",v:["silly","pretty"],by:"drip",fit:1,
   d:"Water splashes when you jump in it. That's the whole thing. It's great."},
  {n:"Cottage Core",c:"pack",v:["cosy","pretty"],by:"hearthfolk",fit:1,hot:1,
   d:"A gentle world of small houses, bread, and absolutely no monsters."},
  {n:"Sky Ruins",c:"world",v:["wild","tricky"],by:"aerie",fit:0,
   d:"Floating islands stitched together with rope bridges. One wrong hop."},
  {n:"Soft Light",c:"shader",v:["pretty","cosy"],by:"lumen",fit:1,
   d:"Makes evenings look like a painting. Costs a little speed."},
  {n:"Chicken Parade",c:"mod",v:["silly"],by:"cluck",fit:1,
   d:"Chickens now march in formation. Nobody asked. Everybody's glad."},
  {n:"Deep Dark Redo",c:"mod",v:["wild","tricky"],by:"abyssal",fit:0,rare:1,
   d:"Rebuilds the scariest part of the game. Not for a first world."},
  {n:"Tiny Farmstead",c:"pack",v:["cosy"],by:"hearthfolk",fit:1,
   d:"Twelve mods that all agree with each other. A calm afternoon in a box."},
  {n:"Balloon Travel",c:"mod",v:["silly","pretty"],by:"updraft",fit:1,rare:1,
   d:"Build a balloon, drift wherever the wind goes. Steering is optional."},
  {n:"Lantern Nights",c:"shader",v:["cosy","pretty"],by:"lumen",fit:1,
   d:"Warm little pools of light. Makes any base feel lived in."},
  {n:"Puzzle Keep",c:"world",v:["tricky"],by:"cogsworth",fit:1,
   d:"Forty rooms, forty locks. No fighting, just thinking."},
  {n:"Mushroom Mayhem",c:"mod",v:["silly","wild"],by:"spore",fit:1,
   d:"Mushrooms grow on everything, including you. Reversible. Mostly."},
  {n:"Old Stone Roads",c:"mod",v:["cosy","pretty"],by:"mossline",fit:1,
   d:"Paths that look walked-on. Small thing, changes the whole feel."},
  {n:"Storm Chaser",c:"mod",v:["wild"],by:"updraft",fit:1,
   d:"Real weather with real consequences. Watch the sky."},
  {n:"Pocket Zoo",c:"pack",v:["silly","cosy"],by:"cluck",fit:1,hot:1,
   d:"Every friendly creature mod that plays nicely together, in one bundle."}
];
ITEMS.forEach(function(it,i){ it.id="i"+i; });

/* ---------- taste model ---------- */
var KEY="agora-browse-v5";
var state={taste:{}, bag:{}, votes:{}};
VIBES.forEach(function(v){ state.taste[v]=0; });
try{ var s=JSON.parse(localStorage.getItem(KEY)||"null");
  if(s){ state=s; VIBES.forEach(function(v){ if(state.taste[v]===undefined) state.taste[v]=0; }); }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
function scoreOf(it){
  var s=0; it.v.forEach(function(v){ s+=state.taste[v]||0; });
  return s + (it.hot?0.6:0) + (state.bag[it.id]?-99:0);   // things you own drop to the back
}
function vote(it, dir){
  var prev=state.votes[it.id]||0;
  var next = prev===dir ? 0 : dir;
  state.votes[it.id]=next;
  it.v.forEach(function(v){ state.taste[v]=(state.taste[v]||0) - prev + next; });
  save(); renderBars(); renderShelf();
  blip(next>0?820:next<0?300:520,.1);
}

/* ---------- UI ---------- */
var cat="all";
function renderStalls(){
  var w=document.getElementById("stalls"); w.innerHTML="";
  CATS.forEach(function(c){
    var el=document.createElement("div");
    el.className="stall"+(cat===c.id?" on":"");
    el.innerHTML='<canvas></canvas><span></span>';
    el.querySelector("span").textContent=c.name;
    el.onclick=function(){ cat=c.id; blip(600,.09); renderStalls(); renderShelf(); };
    w.appendChild(el); paint(el.querySelector("canvas"), c.art);
  });
}
function renderBars(){
  var w=document.getElementById("bars"); w.innerHTML="";
  var max=Math.max(1, Math.max.apply(null, VIBES.map(function(v){ return Math.abs(state.taste[v]); })));
  VIBES.forEach(function(v){
    var val=state.taste[v]||0, pct=Math.max(0,val)/max*100;
    var el=document.createElement("div"); el.className="bar";
    el.innerHTML='<span>'+v+'</span><i><u></u></i>';
    w.appendChild(el);
    var u=el.querySelector("u");
    setTimeout(function(){ u.style.width=pct+"%";
      u.style.background = val>0?"var(--go)":val<0?"var(--no)":"rgba(255,255,255,.2)"; },30);
  });
  var top=VIBES.slice().sort(function(a,b){ return state.taste[b]-state.taste[a]; })[0];
  document.getElementById("vibeNote").textContent =
    state.taste[top]>0 ? "Looks like you're after "+top+" things. Shelf reordered."
                       : "Tap 👍 or 👎 on anything. The shelf quietly rearranges itself.";
}
function renderShelf(){
  var w=document.getElementById("shelf"); w.innerHTML="";
  var list=ITEMS.filter(function(it){ return cat==="all"||it.c===cat; })
                .sort(function(a,b){ return scoreOf(b)-scoreOf(a); });
  if(!list.length){ w.innerHTML='<div class="empty">Nothing on this stall yet.</div>'; return; }
  list.forEach(function(it){
    var el=document.createElement("div");
    el.className="thing"+(it.rare?" rare":"");
    el.innerHTML=(it.hot?'<div class="ribbon">POPULAR</div>':'')+
      (state.bag[it.id]?'<div class="inpack">🎒</div>':'')+
      '<canvas></canvas><b></b><small></small><div class="tags"></div>'+
      '<div class="vote"><button class="yes">👍</button><button class="no">👎</button></div>';
    el.querySelector("b").textContent=it.n;
    el.querySelector("small").textContent="by "+it.by;
    var tg=el.querySelector(".tags");
    it.v.forEach(function(v){ var s=document.createElement("span"); s.className="tag"; s.textContent=v; tg.appendChild(s); });
    var vv=state.votes[it.id]||0;
    if(vv>0) el.querySelector(".yes").classList.add("on");
    if(vv<0) el.querySelector(".no").classList.add("on");
    el.querySelector(".yes").onclick=function(e){ e.stopPropagation(); vote(it,1);
      burst.apply(null,centerOf(e.target).concat(["#8BE24F",12,7])); };
    el.querySelector(".no").onclick=function(e){ e.stopPropagation(); vote(it,-1); };
    el.onclick=function(){ openDetail(it); };
    w.appendChild(el);
    paint(el.querySelector("canvas"), critter(it.n));
  });
}

/* ---------- detail ---------- */
var detail=document.getElementById("detail"), cur=null;
document.getElementById("dClose").onclick=function(){ detail.classList.remove("show"); };
detail.onclick=function(e){ if(e.target===detail) detail.classList.remove("show"); };
document.addEventListener("keydown",function(e){ if(e.key==="Escape") detail.classList.remove("show"); });
function openDetail(it){
  cur=it;
  document.getElementById("dTitle").textContent=it.n;
  document.getElementById("dBy").textContent="made by "+it.by+" · "+it.v.join(", ");
  document.getElementById("dDesc").textContent=it.d;
  var f=document.getElementById("dFit");
  // The health check, restated as one friendly line. Same question the
  // pre-flight asks — just answered before you commit instead of after.
  f.className="fitline"+(it.fit?"":" bad");
  f.textContent = it.fit ? "✅ This fits your world. Nothing else needs changing."
                         : "⚠️ This one won't fit your world as it is — it needs a different game version.";
  var add=document.getElementById("dAdd");
  add.textContent = state.bag[it.id] ? "Take it back out" : "Put it in my bag";
  add.disabled=false;
  detail.classList.add("show");
  paint(document.getElementById("dArt"), critter(it.n));
  say(it.n+". "+(it.fit?"Fits your world.":"Does not fit your world."));
  blip(680,.1);
}
document.getElementById("dAdd").onclick=function(){
  if(!cur) return;
  if(state.bag[cur.id]){ delete state.bag[cur.id]; toast("Taken back out."); blip(340,.12); }
  else{ state.bag[cur.id]=true; toast("Added "+cur.n+" to your bag.");
    fanfare(); burst(innerWidth/2, innerHeight*0.42, "#8BE24F", 34, 11);
    cur.v.forEach(function(v){ state.taste[v]=(state.taste[v]||0)+0.5; }); }
  save(); renderBars(); renderShelf(); updatePack();
  this.textContent = state.bag[cur.id] ? "Take it back out" : "Put it in my bag";
};
document.getElementById("dSimilar").onclick=function(){
  if(!cur) return;
  cur.v.forEach(function(v){ state.taste[v]=(state.taste[v]||0)+1; });
  save(); renderBars(); renderShelf();
  detail.classList.remove("show");
  toast("Shelf reordered around "+cur.v.join(" + ")+".");
  blip(760,.12);
};
function updatePack(){ document.getElementById("packCount").textContent=Object.keys(state.bag).length; }

/* ---------- gacha ---------- */
var gacha=document.getElementById("gacha");
function crank(){
  var pool=ITEMS.filter(function(it){ return !state.bag[it.id]; });
  if(!pool.length){ toast("You've got everything!"); return; }
  // weighted by taste, so "surprise me" still surprises but rarely annoys
  var weights=pool.map(function(it){ return Math.max(0.35, 1+scoreOf(it)); });
  var total=weights.reduce(function(a,b){return a+b;},0), r=Math.random()*total, pick=pool[0];
  for(var i=0;i<pool.length;i++){ r-=weights[i]; if(r<=0){ pick=pool[i]; break; } }
  var hint=document.getElementById("gachaHint");
  hint.textContent="Cranking…"; blip(300,.1,"square");
  var n=0;
  (function spin(){
    if(n++<(reduce?1:7)){
      paint(document.getElementById("gachaArt"), critter(pool[Math.floor(Math.random()*pool.length)].n));
      blip(420+n*40,.05); setTimeout(spin, 70); return;
    }
    paint(document.getElementById("gachaArt"), critter(pick.n));
    hint.textContent="You got: "+pick.n;
    var c=centerOf(gacha); burst(c[0],c[1],"#FFD34E",30,11); fanfare();
    setTimeout(function(){ openDetail(pick); }, reduce?0:260);
    setTimeout(function(){ hint.textContent="Give it another crank";
      paint(document.getElementById("gachaArt"), gachaArt); }, 2600);
  })();
}
gacha.onclick=crank;
gacha.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); crank(); } };

/* ---------- bag ---------- */
document.getElementById("packBtn").onclick=function(){
  var names=Object.keys(state.bag).map(function(id){
    return ITEMS.filter(function(i){return i.id===id;})[0].n; });
  toast(names.length ? "In your bag: "+names.join(", ") : "Your bag is empty. Go poke something.");
  blip(560,.1);
};

/* ---------- toast ---------- */
var toastEl=document.getElementById("toast"), toastT=null;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); say(msg);
  clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove("show"); },2600); }

/* ---------- boot ---------- */
renderStalls(); renderBars(); renderShelf(); updatePack();
paint(document.getElementById("gachaArt"), gachaArt);
addEventListener("resize",function(){ renderShelf(); paint(document.getElementById("gachaArt"), gachaArt); });
window.__BROWSE={ items:ITEMS, state:state, crank:crank, open:openDetail };
})();
</script>
</body>
</html>
