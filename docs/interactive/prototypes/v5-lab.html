<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora — Lab v5 (the workshop)</title>
<style>
  :root{
    --ink:#EAF2F6; --dim:#9FB3C0; --edge:rgba(255,255,255,.12);
    --glass:rgba(14,26,34,.72); --panel:rgba(10,20,27,.86);
    --go:#8BE24F; --no:#FF7A6B; --hint:#FFD34E; --cool:#6FD3E8; --warm:#FFB25E;
    --body:ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
    background:#0A1820;overflow-x:hidden}
  #bg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:0;display:block}
  #vig{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 15%,transparent 35%,rgba(4,12,18,.6) 100%)}
  #fx{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
  .wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:16px 20px 70px}

  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:22px;margin:0;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:13.5px}
  .stamps{margin-left:auto;display:flex;gap:6px;align-items:center}
  .stamp{width:26px;height:26px;border-radius:8px;border:1px solid var(--edge);
    display:grid;place-items:center;font-size:14px;background:rgba(255,255,255,.05);opacity:.35}
  .stamp.on{opacity:1;background:rgba(139,226,79,.18);border-color:rgba(139,226,79,.5)}

  /* ---- station map ---- */
  .map{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;margin-top:18px}
  .station{position:relative;background:var(--glass);border:1px solid var(--edge);border-radius:18px;
    padding:14px;cursor:pointer;transition:transform .12s,border-color .15s;overflow:hidden}
  .station:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3)}
  .station:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .station canvas{display:block;width:100%;height:96px;border-radius:12px;background:rgba(0,0,0,.18)}
  .station h3{margin:10px 0 2px;font-size:16px}
  .station p{margin:0;color:var(--dim);font-size:12.8px;min-height:34px}
  .station .go{margin-top:8px;display:inline-block;font-size:12.5px;font-weight:700;color:#08131a;
    background:var(--go);border-radius:999px;padding:4px 12px}
  .station .done{position:absolute;top:10px;right:10px;font-size:16px}
  .station .prog{display:inline-flex;gap:4px;margin-left:9px;vertical-align:middle}
  .station .dot{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.18);display:block}
  .station .dot.on{background:var(--go)}
  .locked{opacity:.55;cursor:not-allowed}

  /* ---- bench ---- */
  .bench{position:fixed;inset:0;z-index:50;background:rgba(4,10,14,.72);backdrop-filter:blur(3px);
    display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .bench.show{opacity:1;pointer-events:auto}
  .card{width:min(920px,94vw);max-height:90vh;overflow:auto;background:var(--panel);
    border:1px solid var(--edge);border-radius:22px;padding:20px 22px}
  .card h2{margin:0 0 2px;font-size:20px}
  .card .why{color:var(--dim);font-size:13.5px;margin:0 0 14px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .close{position:absolute;top:16px;right:20px;background:rgba(255,255,255,.08);color:var(--ink);
    border:1px solid var(--edge);border-radius:10px;padding:6px 12px;cursor:pointer;font:inherit}

  /* ---- shared bits ---- */
  .tray{display:flex;gap:10px;flex-wrap:wrap;padding:12px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px dashed var(--edge);min-height:92px;flex:1 1 260px}
  .tray h4{width:100%;margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim)}
  .piece{position:relative;width:104px;border-radius:12px;padding:8px;cursor:grab;user-select:none;
    background:rgba(255,255,255,.07);border:1px solid var(--edge);text-align:center;
    transition:transform .12s,box-shadow .15s}
  .piece:active{cursor:grabbing}
  .piece canvas{display:block;width:100%;height:44px}
  .piece b{display:block;font-size:12px;margin-top:4px;font-weight:600}
  .piece small{display:block;font-size:10.5px;color:var(--dim)}
  .piece.ok{box-shadow:0 0 0 2px var(--go) inset;background:rgba(139,226,79,.14)}
  .piece.bad{animation:shake .32s}
  .piece.ghost{opacity:.35}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
    45%{transform:translateX(6px)}70%{transform:translateX(-4px)}}
  .slotbig{flex:1 1 300px;min-height:180px;border-radius:16px;border:2px dashed var(--edge);
    padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-content:flex-start;
    background:rgba(255,255,255,.03);transition:border-color .15s,background .15s}
  .slotbig.hot{border-color:var(--go);background:rgba(139,226,79,.10)}
  .slotbig h4{width:100%;margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim)}
  .say{margin-top:14px;padding:11px 13px;border-radius:13px;font-size:14px;
    background:rgba(111,211,232,.10);border:1px solid rgba(111,211,232,.28);min-height:44px}
  .say.good{background:rgba(139,226,79,.12);border-color:rgba(139,226,79,.36)}
  .say.bad{background:rgba(255,122,107,.12);border-color:rgba(255,122,107,.36)}
  .btn{font:inherit;background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--edge);
    border-radius:11px;padding:8px 15px;cursor:pointer}
  .btn:hover{border-color:rgba(255,255,255,.35)}
  .btn.p{background:var(--go);color:#08131a;border-color:var(--go);font-weight:700}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;align-items:center}
  /* step rail */
  .rail{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
  .pip{font:inherit;font-size:12.5px;display:flex;align-items:center;gap:6px;cursor:pointer;
    background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--edge);
    border-radius:999px;padding:5px 13px}
  .pip u{text-decoration:none;font-weight:800;opacity:.6}
  .pip:hover:not(:disabled){border-color:rgba(255,255,255,.34);color:var(--ink)}
  .pip.now{background:rgba(111,211,232,.16);border-color:var(--cool);color:var(--ink);font-weight:600}
  .pip.ok{color:var(--go)}
  .pip.lock{opacity:.4;cursor:not-allowed}
  .lead{margin:0 0 14px;font-size:14.5px}
  /* predict step */
  .quiz{display:flex;flex-direction:column;gap:8px}
  .opt{font:inherit;text-align:left;background:rgba(255,255,255,.06);color:var(--ink);
    border:1px solid var(--edge);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:14px}
  .opt:hover:not(:disabled){border-color:rgba(255,255,255,.36);transform:translateX(2px)}
  .opt.right{background:rgba(139,226,79,.16);border-color:var(--go)}
  .opt.wrong{background:rgba(255,122,107,.10);border-color:rgba(255,122,107,.3);opacity:.75}
  .opt:disabled{cursor:default}
  .explain{font-size:14.2px;line-height:1.62}
  .explain h4{margin:14px 0 5px;font-size:14.5px;color:var(--cool)}
  .explain h4:first-child{margin-top:0}
  .explain ul{margin:6px 0;padding-left:20px}
  .explain li{margin:4px 0}
  .sub{color:var(--dim);font-size:13px}
  .grown{margin-top:14px;border-top:1px solid var(--edge);padding-top:11px}
  .grown summary{cursor:pointer;color:var(--dim);font-size:12.8px}
  .grown p{font-size:13px;color:var(--dim);margin:8px 0 0}
  code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-size:12.5px}

  /* fix-it board */
  .clues{display:flex;gap:10px;flex-wrap:wrap;flex:1 1 100%}
  .clue{flex:1 1 190px;background:rgba(255,255,255,.05);border:1px solid var(--edge);
    border-radius:12px;padding:10px;font-size:12.8px;cursor:pointer;transition:border-color .15s}
  .clue:hover{border-color:rgba(255,255,255,.32)}
  .clue.read{border-color:rgba(255,211,78,.5);background:rgba(255,211,78,.10)}
  .clue b{display:block;font-size:12px;color:var(--hint);margin-bottom:3px}
  .doors{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .door{flex:1 1 200px;border-radius:14px;border:1px solid var(--edge);padding:12px;
    background:rgba(255,255,255,.04);cursor:pointer;text-align:center;transition:transform .12s}
  .door:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.32)}
  .door canvas{display:block;width:100%;height:58px}
  .door b{display:block;margin-top:6px;font-size:13.5px}
  .door small{color:var(--dim);font-size:11.5px}
  .door.picked{box-shadow:0 0 0 2px var(--cool) inset}
  .net{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:12.8px;
    background:rgba(139,226,79,.10);border:1px solid rgba(139,226,79,.3)}
  .meter{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
  .meter i{display:block;height:100%;width:0;background:var(--go);transition:width .5s}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="vig"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <h1>The Workshop</h1>
    <div class="sub">Six benches. Pick things up, try them, see what happens.</div>
    <div class="stamps" id="stamps" aria-label="Badges earned"></div>
  </header>

  <div class="map" id="map"></div>
  <p class="sub" style="margin-top:18px">
    Nothing here touches your real game. Everything is a pretend copy you can break on purpose.
  </p>
</div>

<div class="bench" id="bench" role="dialog" aria-modal="true" aria-labelledby="benchTitle">
  <div class="card" style="position:relative">
    <button class="close" id="benchClose">Close</button>
    <h2 id="benchTitle"></h2>
    <p class="why" id="benchWhy"></p>
    <div id="benchBody"></div>
  </div>
</div>

<div aria-live="polite" class="sr" id="live"
     style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>

<script>
(function(){
"use strict";
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
var live = document.getElementById("live");
function say(t){ live.textContent = t; }

/* ================= sound ================= */
var ac=null, soundOn=true;
function blip(f,d,type,v){ if(!soundOn||reduce)return;
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type||"triangle"; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(v||.07,ac.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.12));
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.12)+.03);
  }catch(e){} }
function chord(l,gap){ l.forEach(function(f,i){ setTimeout(function(){blip(f,.16);},i*(gap||70)); }); }
function yay(){ chord([523,659,784,1047],70); }
function nope(){ blip(180,.22,"square",.06); }

/* ================= particles ================= */
var fx=document.getElementById("fx"), fc=fx.getContext("2d"), parts=[];
function sizeFx(){ fx.width=innerWidth||1280; fx.height=innerHeight||720; }
sizeFx(); addEventListener("resize",sizeFx); addEventListener("load",sizeFx);
function burst(x,y,c,n,spread){ if(reduce)return;
  for(var i=0;i<(n||18);i++) parts.push({x:x,y:y,vx:(Math.random()-.5)*(spread||8),
    vy:(Math.random()-.95)*(spread||8),s:3+Math.random()*4,life:1,c:c,rot:Math.random()*6});
  if(parts.length>240) parts.splice(0,parts.length-240); }
(function loop(){
  fc.clearRect(0,0,fx.width,fx.height);
  for(var i=parts.length-1;i>=0;i--){ var p=parts[i];
    p.vy+=.3; p.x+=p.vx; p.y+=p.vy; p.life-=.016; p.rot+=.2;
    if(p.life<=0){parts.splice(i,1);continue;}
    fc.globalAlpha=Math.max(p.life,0); fc.fillStyle=p.c;
    fc.save(); fc.translate(p.x,p.y); fc.rotate(p.rot); fc.fillRect(-p.s/2,-p.s/2,p.s,p.s); fc.restore(); }
  fc.globalAlpha=1; requestAnimationFrame(loop);
})();
function centerOf(el){ var r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
document.addEventListener("click",function(e){ if(reduce)return;
  burst(e.clientX,e.clientY,"#9FF5E2",5,4); }, true);

/* ================= calm living background =================
   Deliberately quieter than High Interaction. In the Lab, motion is a teaching
   signal — if the backdrop is busy, a snap or a reject stops reading as the
   consequence of what the learner just did. */
var bg=document.getElementById("bg"), bx=bg.getContext("2d");
var W=0,H=0,mx=.5,my=.5,t0=performance.now();
function sizeBg(){ W=bg.width=innerWidth||document.documentElement.clientWidth||1280;
  H=bg.height=innerHeight||document.documentElement.clientHeight||720; buildRidges(); }
addEventListener("mousemove",function(e){ mx=e.clientX/innerWidth; my=e.clientY/innerHeight; });
var RID=[];
function buildRidges(){
  RID=[]; var layers=[[.62,"#16323F",26,10],[.72,"#1B4150",34,20],[.84,"#20505F",44,34]];
  layers.forEach(function(L,li){
    var pts=[], n=Math.ceil(W/14)+4, seed=li*97.3;
    for(var i=0;i<n;i++){
      var x=i*14;
      pts.push(H*L[0] + Math.sin((x+seed)*0.006)*L[2] + Math.sin((x+seed)*0.017)*L[2]*0.4);
    }
    RID.push({pts:pts,color:L[1],par:L[3]});
  });
}
function bgFrame(now){
  var t=(now-t0)/1000;
  var g=bx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0B2130"); g.addColorStop(.55,"#123243"); g.addColorStop(1,"#17414F");
  bx.fillStyle=g; bx.fillRect(0,0,W,H);
  // a few slow stars so the sky is not dead
  bx.fillStyle="rgba(255,255,255,.20)";
  for(var s=0;s<46;s++){
    var sx=(s*137.5)%W, sy=(s*61.3)%(H*0.42);
    var tw=reduce?1:(0.55+0.45*Math.sin(t*0.8+s));
    bx.globalAlpha=0.16*tw; bx.fillRect(sx,sy,2,2);
  }
  bx.globalAlpha=1;
  RID.forEach(function(R){
    var off=(mx-.5)*R.par, yo=(my-.5)*R.par*0.22;
    bx.fillStyle=R.color; bx.beginPath(); bx.moveTo(-60,H);
    for(var i=0;i<R.pts.length;i++){
      var x=i*14+off-40, y=R.pts[i]+yo;
      bx.lineTo(x,y); bx.lineTo(x+14,y);
    }
    bx.lineTo(W+60,H); bx.closePath(); bx.fill();
  });
  requestAnimationFrame(bgFrame);
}
sizeBg(); addEventListener("resize",sizeBg); addEventListener("load",sizeBg);
requestAnimationFrame(bgFrame);

/* ================= blocky icon painter =================
   Same 4px-tile language as the High Interaction world, so the two modes look
   like one product. Every icon is fillRect only — no images, no network. */
function px(ctx,x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function paint(canvas, fn){
  var c=canvas.getContext("2d"), r=canvas.getBoundingClientRect();
  canvas.width=Math.max(40,Math.round(r.width)); canvas.height=Math.max(30,Math.round(r.height));
  c.clearRect(0,0,canvas.width,canvas.height); fn(c,canvas.width,canvas.height);
}
var ART={
  build:function(c,w,h){ var b=Math.min(w,h)/9, cx=w/2, base=h-b*1.2;
    px(c,cx-b*3,base-b,b*6,b,"#5C4630");
    [[0,2],[1,2],[2,2],[0,1],[1,1],[0,0]].forEach(function(p){
      px(c,cx-b*3+p[0]*b*1.1,base-b*2-p[1]*b,b,b*.9, p[1]===0?"#8BE24F":"#4C8FBF"); });
    px(c,cx+b*1.4,base-b*3.2,b*1.6,b*3.2,"#FFD34E"); },
  mod:function(c,w,h){ var b=Math.min(w,h)/9, cx=w/2, cy=h/2;
    px(c,cx-b*3.2,cy-b*1.4,b*2.8,b*2.8,"#6FD3E8");
    px(c,cx-b*.4,cy-b*.2,b*1,b*1,"#6FD3E8");          // tab
    px(c,cx+b*.6,cy-b*1.4,b*2.8,b*2.8,"#B48CF2");
    px(c,cx+b*.6,cy-b*.2,b*1,b*1,"#0A1820"); },        // notch
  fix:function(c,w,h){ var b=Math.min(w,h)/9, cx=w/2, cy=h/2;
    px(c,cx-b*2.6,cy-b*2.6,b*4.4,b*4.4,"#1B3A48");
    px(c,cx-b*1.9,cy-b*1.9,b*3,b*3,"#9FE8FF");
    px(c,cx+b*1.4,cy+b*1.4,b*2.4,b*.9,"#FFD34E"); },
  heal:function(c,w,h){ var b=Math.min(w,h)/9, cx=w/2, cy=h/2;
    px(c,cx-b*.7,cy-b*2.6,b*1.4,b*5.2,"#FF7A6B");
    px(c,cx-b*2.6,cy-b*.7,b*5.2,b*1.4,"#FF7A6B"); },
  offline:function(c,w,h){ var b=Math.min(w,h)/9, cx=w/2, cy=h/2;
    px(c,cx-b*2.4,cy-b*1.6,b*4.8,b*3.6,"#B08A4A");
    px(c,cx-b*1,cy-b*2.6,b*2,b*1,"#8A6A34");
    px(c,cx-b*.4,cy-b*.4,b*.8,b*1.6,"#3A2A16"); },
  undo:function(c,w,h){ var b=Math.min(w,h)/9, cx=w/2, cy=h/2;
    for(var i=0;i<7;i++){ var a=Math.PI*0.35+i*(Math.PI*1.25/6);
      px(c,cx+Math.cos(a)*b*2.6-b*.4, cy+Math.sin(a)*b*2.6-b*.4, b*.9,b*.9,"#6FD3E8"); }
    px(c,cx-b*3.4,cy-b*2.2,b*1.2,b*1.2,"#8BE24F"); },
  crystal:function(col){ return function(c,w,h){ var b=Math.min(w,h)/6,cx=w/2,cy=h/2;
    px(c,cx-b,cy-b*1.6,b*2,b*3.2,col); px(c,cx-b*1.6,cy-b*.6,b*3.2,b*1.2,col);
    px(c,cx-b*.5,cy-b*1.2,b*.6,b*.8,"rgba(255,255,255,.55)"); }; },
  gear:function(col){ return function(c,w,h){ var b=Math.min(w,h)/7,cx=w/2,cy=h/2;
    px(c,cx-b*1.5,cy-b*1.5,b*3,b*3,col);
    px(c,cx-b*2.3,cy-b*.5,b*.8,b*1,col); px(c,cx+b*1.5,cy-b*.5,b*.8,b*1,col);
    px(c,cx-b*.5,cy-b*2.3,b*1,b*.8,col); px(c,cx-b*.5,cy+b*1.5,b*1,b*.8,col);
    px(c,cx-b*.6,cy-b*.6,b*1.2,b*1.2,"#0A1820"); }; },
  box:function(col,notch){ return function(c,w,h){ var b=Math.min(w,h)/6,cx=w/2,cy=h/2;
    px(c,cx-b*2,cy-b*1.5,b*4,b*3,col);
    if(notch==="tab") px(c,cx+b*2,cy-b*.5,b*.8,b*1,col);
    if(notch==="hole") px(c,cx-b*2,cy-b*.5,b*.8,b*1,"#0A1820"); }; },
  door:function(col,face){ return function(c,w,h){ var b=Math.min(w,h)/7,cx=w/2,base=h-b;
    px(c,cx-b*2,base-b*5,b*4,b*5,col);
    px(c,cx+b*1.1,base-b*2.6,b*.7,b*.7,"#0A1820");
    if(face==="?"){ px(c,cx-b*.9,base-b*4,b*1.8,b*.6,"#0A1820");
      px(c,cx+b*.3,base-b*3.4,b*.6,b*.8,"#0A1820"); px(c,cx-b*.3,base-b*2.6,b*.6,b*.6,"#0A1820"); } }; }
};

/* ================= progress ================= */
// v5b: progress is now per STEP, not per bench, so the key is bumped rather
// than trying to migrate the old boolean shape.
var KEY="agora-lab-v5b";
var done={};
try{ done=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ done={}; }
function saveDone(){ try{ localStorage.setItem(KEY,JSON.stringify(done)); }catch(e){} }
function stepCount(id){ return (BENCHES[id]||[]).length; }
function stepsDoneCount(id){
  var d=done[id]; if(!d) return 0;
  return (BENCHES[id]||[]).filter(function(s){ return d[s.id]; }).length;
}
function benchComplete(id){ return stepCount(id)>0 && stepsDoneCount(id)===stepCount(id); }

var bench=document.getElementById("bench"), benchBody=document.getElementById("benchBody");
document.getElementById("benchClose").onclick=closeBench;

document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeBench(); });
function closeBench(){ bench.classList.remove("show"); }
/* Each bench is four steps that escalate rather than one demonstration:
     do       — handle it. Learn what the pieces are and how they behave.
     predict  — commit to a guess BEFORE seeing the outcome. Being wrong here is
                the point; a surprise is what makes the rule stick.
     transfer — the same principle wearing different clothes. If you can only do
                the first version, you pattern-matched instead of understanding.
     explain  — the mechanism and the real vocabulary, once there is something
                to attach them to.
   Later steps stay locked until the earlier ones are done, so the difficulty
   only ever goes up. */
var curBench=null, curStep=0;
function firstUndone(id){
  var steps=BENCHES[id]||[];
  for(var i=0;i<steps.length;i++) if(!(done[id]&&done[id][steps[i].id])) return i;
  return 0;                                     // all done — reopen at the start
}
function openBench(st, step){
  curBench=st; curStep = step!==undefined ? step : firstUndone(st.id);
  document.getElementById("benchTitle").textContent=st.title;
  document.getElementById("benchWhy").textContent=st.why;
  bench.classList.add("show");
  blip(620,.1);
  renderStep();
}
function stepsOf(id){ return BENCHES[id]; }
function stepDone(benchId, i){ return !!(done[benchId] && done[benchId][stepsOf(benchId)[i].id]); }
function markStep(benchId, i){
  done[benchId]=done[benchId]||{};
  if(done[benchId][stepsOf(benchId)[i].id]) return;
  done[benchId][stepsOf(benchId)[i].id]=true; saveDone();
  blip(880,.12);
  var all=stepsOf(benchId).every(function(_,k){ return stepDone(benchId,k); });
  if(all) complete(benchId); else { renderStamps(); renderMap(); }
}
function renderStep(){
  var steps=stepsOf(curBench.id);
  benchBody.innerHTML="";
  // step rail
  var rail=document.createElement("div"); rail.className="rail";
  steps.forEach(function(s,i){
    var b=document.createElement("button");
    var open = i===0 || stepDone(curBench.id,i-1);
    b.className="pip"+(i===curStep?" now":"")+(stepDone(curBench.id,i)?" ok":"")+(open?"":" lock");
    b.innerHTML='<u>'+(i+1)+'</u>'+s.title+(stepDone(curBench.id,i)?" ✓":(open?"":" 🔒"));
    b.disabled=!open;
    b.onclick=function(){ curStep=i; renderStep(); };
    rail.appendChild(b);
  });
  benchBody.appendChild(rail);

  var s=steps[curStep];
  var lead=document.createElement("p"); lead.className="lead"; lead.textContent=s.lead;
  benchBody.appendChild(lead);

  var host=document.createElement("div"); benchBody.appendChild(host);
  s.build(host, function(){ markStep(curBench.id, curStep); nextUp(host); });
  say(curBench.title+", step "+(curStep+1)+" of "+steps.length+": "+s.title+". "+s.lead);
}
function nextUp(host){
  var steps=stepsOf(curBench.id);
  if(host.querySelector(".nextrow")) return;
  var row=document.createElement("div"); row.className="acts nextrow";
  if(curStep<steps.length-1){
    var b=document.createElement("button"); b.className="btn p";
    b.textContent="Next: "+steps[curStep+1].title;
    b.onclick=function(){ curStep++; renderStep(); };
    row.appendChild(b);
  } else if(!host.querySelector(".explain")){
    // Last step, and it isn't an explain step (which supplies its own exit).
    var b2=document.createElement("button"); b2.className="btn p";
    b2.textContent="Back to the workshop";
    b2.onclick=closeBench;
    row.appendChild(b2);
  } else return;                      // explain step already has the close button
  host.appendChild(row);
}
/* A predict step: choose, then find out. The reveal always explains WHY the
   other answers were wrong — a bare "correct!" teaches nothing. */
function askStep(host, q, onDone){
  var wrap=document.createElement("div"); wrap.className="quiz"; host.appendChild(wrap);
  var out=saidEl(host);
  tell(out,"No penalty for guessing wrong. Guessing wrong is how this works.");
  q.options.forEach(function(o,i){
    var b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
    b.onclick=function(){
      if(wrap.dataset.answered) return;
      wrap.dataset.answered="1";
      wrap.querySelectorAll(".opt").forEach(function(x,k){
        x.classList.add(q.options[k].right?"right":"wrong"); x.disabled=true;
      });
      if(o.right){ blip(880,.14); burst.apply(null,centerOf(b).concat(["#8BE24F",20,9]));
        tell(out,"Yes. "+o.why,"good"); }
      else { nope(); tell(out,"Not quite. "+o.why+" "+
        q.options.filter(function(x){return x.right;})[0].t+" — "+
        q.options.filter(function(x){return x.right;})[0].why,"bad"); }
      if(q.after) q.after(host);
      onDone();
    };
    wrap.appendChild(b);
  });
}
function explainStep(host, html, onDone){
  var d=document.createElement("div"); d.className="explain"; d.innerHTML=html; host.appendChild(d);
  var row=document.createElement("div"); row.className="acts";
  var last = curStep === stepsOf(curBench.id).length-1;
  var b=document.createElement("button"); b.className="btn p";
  b.textContent = last ? "Got it — back to the workshop" : "Got it";
  b.onclick=function(){
    b.disabled=true; onDone();
    // On the final step this IS the exit. Leave a beat so the badge lands
    // on screen before the panel goes away.
    if(last) setTimeout(closeBench, reduce?0:1000);
  };
  row.appendChild(b); host.appendChild(row);
}
function saidEl(parent){
  var d=document.createElement("div"); d.className="say"; parent.appendChild(d); return d;
}
function tell(el,msg,kind){
  el.textContent=msg; el.className="say"+(kind?" "+kind:"");
  say(msg);
}
function moreInfo(parent, text){
  var d=document.createElement("details"); d.className="grown";
  d.innerHTML='<summary>More info</summary><p></p>';
  d.querySelector("p").innerHTML=text; parent.appendChild(d); return d;
}
function mkPiece(spec){
  var el=document.createElement("div"); el.className="piece"; el.draggable=true;
  el.innerHTML='<canvas></canvas><b></b><small></small>';
  el.querySelector("b").textContent=spec.name;
  el.querySelector("small").textContent=spec.note||"";
  el.dataset.id=spec.id;
  return el;
}
/* Pointer drag that works with mouse and touch. Kept deliberately simple:
   pick up, drop on a target, everything else is a click. */
function draggable(el, onDrop){
  el.addEventListener("pointerdown", function(e){
    if(e.button) return;
    e.preventDefault();
    var r=el.getBoundingClientRect();
    var g=el.cloneNode(true);
    g.style.cssText="position:fixed;z-index:80;pointer-events:none;width:"+r.width+"px;opacity:.9";
    document.body.appendChild(g);
    var mv=function(ev){
      g.style.left=(ev.clientX-r.width/2)+"px"; g.style.top=(ev.clientY-22)+"px";
      var t=document.elementFromPoint(ev.clientX,ev.clientY);
      document.querySelectorAll(".slotbig").forEach(function(s){ s.classList.remove("hot"); });
      var slot=t&&t.closest&&t.closest(".slotbig"); if(slot) slot.classList.add("hot");
    };
    mv(e);
    var up=function(ev){
      document.removeEventListener("pointermove",mv);
      document.removeEventListener("pointerup",up);
      g.remove();
      document.querySelectorAll(".slotbig").forEach(function(s){ s.classList.remove("hot"); });
      var t=document.elementFromPoint(ev.clientX,ev.clientY);
      var slot=t&&t.closest&&t.closest(".slotbig");
      if(slot) onDrop(slot, ev);
    };
    document.addEventListener("pointermove",mv);
    document.addEventListener("pointerup",up);
  });
  // keyboard equivalent — drag is never the only way in
  el.tabIndex=0;
  el.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){ e.preventDefault();
      var slot=document.querySelector(".slotbig"); if(slot) onDrop(slot,{clientX:0,clientY:0}); }
  });
}

/* ================= bench content =================
   Every bench is four steps. See renderStep() for why they are shaped this way.
   The `do` and `transfer` steps share their machinery — a transfer step is not a
   harder puzzle, it is the SAME rule with the surface details changed, which is
   the only way to tell understanding apart from pattern-matching. */

function worldBench(host, cfg, onWin){
  var state={version:null, loader:null};
  var wrap=document.createElement("div"); wrap.className="row"; host.appendChild(wrap);
  var tray=document.createElement("div"); tray.className="tray";
  tray.innerHTML="<h4>Parts bin</h4>"; wrap.appendChild(tray);
  var slot=document.createElement("div"); slot.className="slotbig";
  slot.innerHTML="<h4>"+(cfg.slotLabel||"Your world")+"</h4>"; wrap.appendChild(slot);
  if(cfg.goal){
    var g=document.createElement("div"); g.className="piece"; g.style.cssText="width:126px;cursor:default";
    g.innerHTML='<canvas></canvas><b></b><small></small>';
    g.querySelector("b").textContent=cfg.goal.name;
    g.querySelector("small").textContent=cfg.goal.note;
    slot.appendChild(g); paint(g.querySelector("canvas"), cfg.goal.art);
  }
  var out=saidEl(host);
  tell(out,cfg.hint);

  var PARTS=[
    {id:"v1201",name:"Game 1.20.1",note:"a version",kind:"version",art:ART.crystal("#6FD3E8")},
    {id:"v121", name:"Game 1.21",  note:"a version",kind:"version",art:ART.crystal("#8BB6F2")},
    // Deliberately fictional. The lesson needs a loader that does NOT fit, and
    // attaching that to a real product would be inventing a compatibility claim
    // about someone else's software. Real names appear only in the Why step,
    // where they are described accurately.
    {id:"loaderA",name:"Loader A",note:"made for 1.20.1",kind:"loader",fits:"v1201",art:ART.gear("#8BE24F")},
    {id:"loaderB",name:"Loader B",note:"made for 1.21",  kind:"loader",fits:"v121", art:ART.gear("#FFB25E")},
    {id:"none",  name:"No loader",note:"plain game",kind:"loader",fits:"*",  art:ART.gear("#9FB3C0")}
  ];
  PARTS.forEach(function(sp){
    var el=mkPiece(sp); tray.appendChild(el); paint(el.querySelector("canvas"), sp.art);
    draggable(el, function(target){ place(sp, el, target); });
  });
  function reject(el,msg){ el.classList.add("bad"); nope(); tell(out,msg,"bad");
    setTimeout(function(){ el.classList.remove("bad"); },340); }
  function place(sp, el, target){
    if(target!==slot) return;
    if(sp.kind==="version"){
      if(state.version){ reject(el,"You already have a game version in there. One is enough."); return; }
      if(cfg.needVersion && sp.id!==cfg.needVersion){
        reject(el, cfg.goal.name+" was built for "+
          PARTS.filter(function(p){return p.id===cfg.needVersion;})[0].name+
          ". Put that version in instead — the mod can't bend to fit.");
        return;
      }
      state.version=sp.id; slot.appendChild(el); el.classList.add("ok");
      blip(760,.1); burst.apply(null,centerOf(el).concat(["#6FD3E8",14,7]));
      tell(out,"That's the game itself. Now a loader — that's the part that lets add-ons work.");
      return;
    }
    if(!state.version){ reject(el,"Put a game version in first — a loader needs something to sit on."); return; }
    if(sp.fits!=="*" && sp.fits!==state.version){
      reject(el, sp.name+" doesn't fit this game. It's built for "+
        PARTS.filter(function(p){return p.id===sp.fits;})[0].name+". Try the other one.");
      return;
    }
    if(state.loader){ reject(el,"You've already got a loader. One at a time."); return; }
    if(cfg.needLoaderNotNone && sp.id==="none"){
      reject(el,"With no loader there's nothing for "+cfg.goal.name+" to plug into. It needs a real one.");
      return;
    }
    state.loader=sp.id; slot.appendChild(el); el.classList.add("ok");
    blip(880,.14); burst.apply(null,centerOf(el).concat(["#8BE24F",22,9]));
    tell(out, cfg.win(sp), "good");
    onWin();
  }
}

/* ---- Add stuff: shared machinery for both its `do` and `transfer` steps ---- */
function modBench(host, opt, onWin){
  var placed={}, shared=opt.mode==="shared";
  var wrap=document.createElement("div"); wrap.className="row"; host.appendChild(wrap);
  var tray=document.createElement("div"); tray.className="tray";
  tray.innerHTML="<h4>Shelf</h4>"; wrap.appendChild(tray);
  var slot=document.createElement("div"); slot.className="slotbig";
  slot.innerHTML="<h4>Your world"+(shared?" — click anything in here to take it out":"")+"</h4>";
  wrap.appendChild(slot);
  var out=saidEl(host);
  tell(out, shared ? "Add both cave mods. Then take them out one at a time."
                   : "Drag Better Caves in. Watch what comes with it.");

  var MODS = shared ? [
    {id:"caves",  name:"Better Caves", note:"needs a helper", art:ART.box("#B48CF2","hole"), needs:"core"},
    {id:"deep",   name:"Deep Tunnels", note:"needs a helper", art:ART.box("#8BB6F2","hole"), needs:"core"},
    {id:"core",   name:"Core Helper",  note:"a helper",       art:ART.box("#6FD3E8","tab")}
  ] : [
    {id:"caves",  name:"Better Caves", note:"needs a helper", art:ART.box("#B48CF2","hole"), needs:"core", enemy:"terrain"},
    {id:"core",   name:"Core Helper",  note:"a helper",       art:ART.box("#6FD3E8","tab")},
    {id:"tex",    name:"Nice Textures",note:"optional",       art:ART.box("#8BE24F")},
    {id:"terrain",name:"Terrain Redo", note:"changes caves too", art:ART.box("#FF7A6B")}
  ];
  var byId={}; MODS.forEach(function(m){ byId[m.id]=m; });
  MODS.forEach(function(m){
    var el=mkPiece(m); el.dataset.mid=m.id; tray.appendChild(el);
    paint(el.querySelector("canvas"), m.art);
    draggable(el, function(target){ place(m, el, target); });
    if(shared) el.addEventListener("click", function(){ if(placed[m.id]) remove(m, el); });
  });
  function elFor(id){ return host.querySelector('[data-mid="'+id+'"]'); }
  function needers(id){ return Object.keys(placed).filter(function(k){ return byId[k].needs===id; }); }

  function remove(m, el){
    if(m.needs===undefined && needers(m.id).length){
      el.classList.add("bad"); nope();
      tell(out, byId[needers(m.id)[0]].name+" still needs "+m.name+
        ", so it stays. Take the mods that need it out first.","bad");
      setTimeout(function(){ el.classList.remove("bad"); },340);
      return;
    }
    delete placed[m.id]; tray.appendChild(el); el.classList.remove("ok"); blip(360,.12);
    // once nothing needs the helper any more, it leaves on its own
    var helper=byId.core;
    if(placed.core && !needers("core").length){
      var he=elFor("core");
      setTimeout(function(){
        delete placed.core; tray.appendChild(he); he.classList.remove("ok"); blip(300,.14);
        tell(out,"Nothing needs Core Helper now, so it left too. It only stayed while something used it.","good");
        onWin();
      }, reduce?0:420);
      tell(out,"Took "+m.name+" out. Watch the helper.");
      return;
    }
    tell(out, placed.core
      ? "Took "+m.name+" out — but Core Helper stayed, because the other mod still needs it."
      : "Took "+m.name+" out.");
  }
  function place(m, el, target){
    if(target!==slot || placed[m.id]) return;
    var foe = m.enemy && placed[m.enemy] ? m.enemy : Object.keys(placed).filter(function(k){
      return byId[k].enemy===m.id; })[0];
    if(foe){
      el.classList.add("bad"); nope();
      var fe=elFor(foe); if(fe){ fe.classList.add("bad"); setTimeout(function(){fe.classList.remove("bad");},340); }
      tell(out, m.name+" and "+byId[foe].name+" both want to change the same caves. "+
        "They can't both be in there — take one out.","bad");
      setTimeout(function(){ el.classList.remove("bad"); },340);
      return;
    }
    placed[m.id]=true; slot.appendChild(el); el.classList.add("ok");
    blip(780,.11); burst.apply(null,centerOf(el).concat(["#B48CF2",16,8]));
    if(m.needs && !placed[m.needs]){
      var helper=elFor(m.needs);
      setTimeout(function(){
        placed[m.needs]=true; slot.appendChild(helper); helper.classList.add("ok");
        blip(980,.12); burst.apply(null,centerOf(helper).concat(["#6FD3E8",18,8]));
        tell(out, m.name+" can't run on its own, so it brought "+byId[m.needs].name+
          " along. You don't have to do anything.","good");
        check();
      }, reduce?0:420);
      tell(out, m.name+" is going in… and it needs a helper.");
      return;
    }
    if(m.needs && placed[m.needs])
      tell(out, m.name+" needs the same helper — and it's already in there, so nothing new arrived.","good");
    if(m.id==="tex") tell(out,"Optional extras are safe to skip. Nothing breaks either way.","good");
    check();
  }
  function check(){
    if(shared){ if(placed.caves && placed.deep && placed.core)
      tell(out,"Both mods in, one helper. Now take them out one at a time.","good"); return; }
    if(placed.caves && placed.core) onWin();
  }
  if(!shared) moreInfo(host,"Required helpers are <code>dependencies</code>; the clash is a "+
    "<code>conflict</code>. Agora resolves the whole graph before staging anything.");
}

/* ---- Something broke: shared machinery for its `do` and `transfer` steps ---- */
function fixBench(host, opt, onWin){
  var messenger=opt.mode==="messenger";
  var read={}, picked=null;
  var CLUES = messenger ? [
    {id:"c1",t:"The last thing it said",s:"It named “Nice Textures” — a mod you've had for months."},
    {id:"c2",t:"What changed recently",s:"You updated Core Helper yesterday. Nothing else."},
    {id:"c3",t:"What it was doing",s:"“Nice Textures” stopped because something it asked for wasn't there."}
  ] : [
    {id:"c1",t:"The last thing it said",s:"It named one of your add-ons right before it closed."},
    {id:"c2",t:"How long it lasted",s:"It shut down about two seconds after starting."},
    {id:"c3",t:"What changed recently",s:"You added something new yesterday."}
  ];
  var SUSPECTS = messenger ? [
    {id:"tex",  name:"Nice Textures", hint:"The one named in the message", conf:.4,
     art:ART.door("#8BE24F","?")},
    {id:"core", name:"The Core Helper update", hint:"Changed yesterday; others depend on it", conf:.75, right:true,
     art:ART.door("#6FD3E8","?")},
    {id:"world",name:"A damaged world", hint:"Nothing points this way", conf:.1,
     art:ART.door("#FFB25E","?")}
  ] : [
    {id:"mod",  name:"The new add-on", hint:"It was named in the message", conf:.8, right:true,
     art:ART.door("#B48CF2","?")},
    {id:"mem",  name:"Not enough memory", hint:"Usually takes longer to fail", conf:.35,
     art:ART.door("#6FD3E8","?")},
    {id:"world",name:"A damaged world", hint:"Would break later, not at startup", conf:.15,
     art:ART.door("#FFB25E","?")}
  ];

  var row=document.createElement("div"); row.className="row"; host.appendChild(row);
  var box=document.createElement("div"); box.className="clues"; row.appendChild(box);
  CLUES.forEach(function(c){
    var el=document.createElement("div"); el.className="clue";
    el.innerHTML='<b>'+c.t+'</b><span>Tap to read</span>';
    el.onclick=function(){ if(read[c.id])return; read[c.id]=true;
      el.classList.add("read"); el.querySelector("span").textContent=c.s;
      blip(560,.09); burst.apply(null,centerOf(el).concat(["#FFD34E",10,6]));
      tell(out, Object.keys(read).length<3
        ? "Good. Read the others too — one clue on its own can point the wrong way."
        : (messenger ? "Careful. The name in a message is where it stopped, not always why."
                     : "Now you've got the whole picture. Pick the most likely suspect."));
      if(Object.keys(read).length===3) doors.style.display="flex";
    };
    box.appendChild(el);
  });
  var out=saidEl(host);
  tell(out,"Read all three clues before you guess.");

  var doors=document.createElement("div"); doors.className="doors";
  doors.style.display="none"; host.appendChild(doors);
  SUSPECTS.forEach(function(s){
    var el=document.createElement("div"); el.className="door";
    el.innerHTML='<canvas></canvas><b></b><small></small><div class="meter"><i></i></div>';
    el.querySelector("b").textContent=s.name;
    el.querySelector("small").textContent=s.hint;
    doors.appendChild(el); paint(el.querySelector("canvas"), s.art);
    setTimeout(function(){ var m=el.querySelector(".meter i"); m.style.width=(s.conf*100)+"%";
      m.style.background=s.conf>.6?"var(--go)":s.conf>.3?"var(--hint)":"var(--no)"; },60);
    el.onclick=function(){
      doors.querySelectorAll(".door").forEach(function(d){ d.classList.remove("picked"); });
      el.classList.add("picked"); picked=s; blip(640,.1);
      tell(out,"You picked "+s.name+". Now test it — safely.");
      runBtn.disabled=false;
    };
  });

  var net=document.createElement("div"); net.className="net";
  net.textContent="Safety net: a return point is saved first. Whatever happens, you can put it back exactly as it was.";
  host.appendChild(net);

  var acts=document.createElement("div"); acts.className="acts"; host.appendChild(acts);
  var runBtn=document.createElement("button"); runBtn.className="btn p";
  runBtn.textContent="Try it (one change only)"; runBtn.disabled=true; acts.appendChild(runBtn);

  runBtn.onclick=function(){
    if(!picked) return;
    runBtn.disabled=true;
    var steps=["Saving a return point…","Changing one thing…","Starting it up…"];
    var i=0;
    (function step(){
      if(i<steps.length){ tell(out,steps[i]); blip(420+i*90,.1); i++;
        setTimeout(step, reduce?60:600); return; }
      if(picked.right){
        tell(out, messenger
          ? "It started. The crash named Nice Textures, but the cause was the helper it depends on — the mod that fell over was just the messenger."
          : "It started. So it really was the new add-on — you changed one thing, so you know it was that one.","good");
        burst(innerWidth/2,innerHeight*0.4,"#8BE24F",40,12); yay();
        onWin();
      } else {
        tell(out, picked.id==="tex"
          ? "Still broken. Turning off the mod that was named didn't help — which is a strong hint it wasn't the cause, only where it stopped."
          : "Still broken. That's useful — you've ruled one out. Put it back and try another.","bad");
        nope();
        var u=document.createElement("button"); u.className="btn"; u.textContent="Undo that change";
        u.onclick=function(){ tell(out,"Put back exactly as it was. Pick another suspect.");
          blip(520,.12); u.remove(); runBtn.disabled=false; };
        acts.appendChild(u);
      }
    })();
  };
}

/* ================= boot ================= */
renderStamps(); renderMap();
window.__LAB={ open:openBench, stations:STATIONS, done:done, complete:complete };
})();
