<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Custom dashboard</title>
<style>body{font:18px system-ui;padding:2rem;background:#162820;color:#effaf1}button{font:inherit;padding:.6rem 1rem}p{line-height:1.5}</style></head>
<body><h1>My instance dashboard</h1><p>This panel uses its own HTML and calls a declared plugin command.</p>
<button id="count">Read and remember instance count</button><p id="result" role="status"></p>
<script>
let sequence = 0;
document.querySelector('#count').onclick = () => {
  parent.postMessage({type:'agora:command',requestId:String(++sequence),commandId:'count'}, '*');
};
window.addEventListener('message', (event) => {
  if (event.source !== parent || event.data?.type !== 'agora:result') return;
  document.querySelector('#result').textContent = event.data.error || `You have ${event.data.value.total} instances. Count saved.`;
});
</script></body></html>
