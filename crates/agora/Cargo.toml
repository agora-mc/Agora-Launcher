[package]
name = "agora-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Agora launcher CLI \u2014 standalone command-line interface for instance management, health checks, and MCP server"

[[bin]]
name = "agora"
path = "src/main.rs"

[dependencies]
agora-core = { path = "../agora-core" }
agora-game-api = { path = "../agora-game-api" }
agora-game-minecraft = { path = "../agora-game-minecraft" }
agora-game-creation = { path = "../agora-game-creation" }
agora-plugin-api = { path = "../agora-plugin-api" }
agora-plugin-host = { path = "../agora-plugin-host" }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
# Author tooling only: `agora plugin keygen` and `agora plugin sign`. The
# launcher itself never holds a private key.
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
# OS-trash adapter for "Recently deleted" purges and the cleanup pass. Core
# takes it as a callback; the desktop app uses the same crate (already locked).
trash = "3"

[dev-dependencies]
agora-core = { path = "../agora-core", features = ["test-support"] }
agora-game-minecraft = { path = "../agora-game-minecraft", features = ["test-support"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }

# Builds the .mrpack fixtures for the `pack update` tests. Already in the lock
# file through agora-core.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
