[package]
name = "agora-game-minecraft"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Minecraft support for Agora, as a game package behind agora-game-api"

[lib]
name = "agora_game_minecraft"
path = "src/lib.rs"

[features]
# Test seams (fake credentials, mock Java inspection). Never in a release build.
test-support = ["agora-core/test-support"]

# SLICE 2 SCAFFOLD: the agora-core dependency and most of the list below are
# temporary while modules move. When slice 2 is done this crate depends on
# agora-game-api plus ordinary libraries only (MASTER_SPEC §26.12).
[dependencies]
agora-core = { path = "../agora-core" }
agora-game-api = { path = "../agora-game-api" }
agora-plugin-api = { path = "../agora-plugin-api" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
zip = "0.6"
toml = "0.8.2"
urlencoding = "2"
async-trait = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
semver = { workspace = true }
tar = "0.4"
sysinfo = { workspace = true }
ed25519-dalek = { workspace = true }
md-5 = { workspace = true }
keyring = "2"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = { workspace = true }
flate2 = "1"

[dev-dependencies]
tempfile = "3"
# Registers Minecraft with core when a test binary loads (see lib.rs).
ctor = "0.8"
agora-plugin-host = { path = "../agora-plugin-host" }
agora-core = { path = "../agora-core", features = ["test-support"] }
