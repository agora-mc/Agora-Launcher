[package]
name = "agora-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Agora launcher core — shared business logic for the Tauri GUI, CLI, and MCP listener"

[lib]
name = "agora_core"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
# The plugin contract. Types only: no script engine, no transport, nothing
# that would breach the "no tauri/clap/MCP in core" rule.
agora-plugin-api = { path = "../agora-plugin-api" }

# Pure logic only. NO tauri, clap, or MCP-protocol crates may appear here —
# the core must stay UI-agnostic so all three front-ends (Tauri GUI, agora
# CLI, agora serve MCP) can consume it equally. (Plan constraint C2/C3.)
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
ed25519-dalek = { workspace = true }
zip = "0.6"
toml = "0.8.2"
urlencoding = "2"
async-trait = { workspace = true }
keyring = "2"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
base64 = { workspace = true }
uuid = { workspace = true }
sysinfo = { workspace = true }
rand = { workspace = true }
semver = { workspace = true }
tar = "0.4"
flate2 = "1"

# Directory junctions for shared folders on Windows. `std`'s symlink_dir needs
# Developer Mode or elevation and, when it fails, callers silently fall back to
# copying — which for a *shared* folder means two trees that drift apart with no
# error. Junctions need no elevation and are not in std.
[target.'cfg(windows)'.dependencies]
junction = "2"

# DPAPI for the credential fallback. Windows Credential Manager caps a secret at
# CRED_MAX_CREDENTIAL_BLOB_SIZE (2560 bytes, so 1280 chars once keyring encodes
# UTF-16), which a Minecraft access token plus an Entra refresh token exceeds on
# every sign-in. DPAPI has no such ceiling and is what Microsoft's own
# msal-extensions uses to persist a token cache on Windows.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3"
# Test-only. The shipped dependency graph keeps the JS engine out of core —
# core holds `dyn ScriptHost` — but the end-to-end tests are only meaningful
# against the runtime that actually ships.
agora-plugin-host = { path = "../agora-plugin-host" }
